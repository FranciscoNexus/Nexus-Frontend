<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Frontend</title>
    <style>
        :root {
            --card-width: 180px;
            --card-height: 260px;
            --card-radius: 10px;
            --select-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Topo */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            z-index: 20;
        }

        .game-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70vw;
        }

        .top-right-group {
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
        }

        .battery-display {
            font-size: 14px;
            font-weight: 600;
            color: #dddddd;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            z-index: 21;
        }

        .settings-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Carrossel */
        .carousel-container {
            flex: 1;
            display: flex;
            align-items: center;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 0 30px;
            gap: 20px;
            scrollbar-width: none;
        }

        .carousel-container::-webkit-scrollbar {
            display: none;
        }

        .game-card {
            flex: 0 0 auto;
            width: var(--card-width);
            height: var(--card-height);
            border-radius: var(--card-radius);
            overflow: hidden;
            background-color: #111;
            border: 3px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            position: relative;
            cursor: pointer;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .game-card.selected {
            transform: scale(1.1) translateY(-4px);
            border-color: var(--select-color);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.25);
            z-index: 5;
        }

        .platform-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Card de Adicionar Jogo */
        .add-card {
            flex: 0 0 auto;
            width: var(--card-width);
            height: var(--card-height);
            border-radius: var(--card-radius);
            background-color: rgba(255, 255, 255, 0.05);
            border: 3px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .add-card.selected {
            border-color: var(--select-color);
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.12);
        }

        .add-icon {
            font-size: 48px;
            color: #aaa;
        }

        .add-text {
            font-size: 13px;
            color: #aaa;
            font-weight: bold;
        }

        /* Rodapé */
        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 20px;
            padding: 10px 15px;
            font-size: 12px;
            color: #aaaaaa;
            background: linear-gradient(to top, rgba(0,0,0,0.98), transparent);
            z-index: 10;
        }

        .button-hint {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 10px;
            color: #000;
        }

        .btn-a { background-color: #4CD964; }
        .btn-b { background-color: #FF3B30; color: #fff; }
        .btn-x { background-color: #007AFF; color: #fff; }
        .btn-y { background-color: #FFCC00; }

        /* Modais */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #161618;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
        }

        .modal-content h2 {
            margin-bottom: 12px;
            font-size: 18px;
        }

        .settings-group {
            text-align: left;
            margin-bottom: 12px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }

        .settings-group h3 {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .input-row input, .input-row select {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
        }

        .input-row label {
            font-size: 11px;
            color: #aaa;
        }

        .cover-tools {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .cover-tools button {
            flex: 1;
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .search-results {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            text-align: left;
        }

        .search-item {
            padding: 8px;
            background: #222;
            margin-bottom: 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }

        .modal-btn {
            background: #333;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .modal-btn.primary { background: #007AFF; }
        .modal-btn.danger { background: #FF3B30; }
    </style>
</head>
<body onclick="requestFullscreen()">

    <div class="top-bar">
        <div class="game-title" id="gameTitle">Carregando...</div>
        <div class="top-right-group">
            <div class="battery-display" id="batteryLevel">--%</div>
            <button class="settings-btn" id="settingsBtn" title="Configurações Visuais" onclick="openSettingsModal()">⚙</button>
        </div>
    </div>

    <div class="carousel-container" id="carousel"></div>

    <!-- Rodapé -->
    <div class="bottom-bar">
        <div class="button-hint" onclick="handleActionA()"><span class="btn-icon btn-a">A</span> Abrir</div>
        <div class="button-hint" onclick="handleActionB()"><span class="btn-icon btn-b">B</span> Voltar</div>
        <div class="button-hint" onclick="handleActionY()"><span class="btn-icon btn-y">Y</span> Pesquisar</div>
        <div class="button-hint" onclick="handleActionX()"><span class="btn-icon btn-x">X</span> Aleatório</div>
    </div>

    <!-- Modal Configurações Visuais (⚙) -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>Configurações Visuais</h2>
            <div class="settings-group">
                <h3>Ajustes da Interface</h3>
                <div class="input-row">
                    <label>Tamanho das Capas: <span id="sizeVal">180</span>px</label>
                    <input type="range" id="cardWidthRange" min="120" max="260" value="180" oninput="updateCardSize(this.value)">
                </div>
                <div class="input-row">
                    <label>Arredondamento dos Cantos:</label>
                    <select id="cardRadiusSelect" onchange="updateCardRadius(this.value)">
                        <option value="0px">Cantos Retos (0px)</option>
                        <option value="10px" selected>Arredondado Padrão (10px)</option>
                        <option value="20px">Super Arredondado (20px)</option>
                        <option value="50%circular">Circular / Círculo</option>
                    </select>
                </div>
                <div class="input-row">
                    <label>Cor da Margem de Seleção:</label>
                    <input type="color" id="selectColorPicker" value="#ffffff" onchange="updateSelectColor(this.value)" style="height: 35px; cursor: pointer;">
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn primary" onclick="closeModal('settingsModal')">Concluído (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal Adicionar Jogo -->
    <div class="modal" id="addGameModal">
        <div class="modal-content">
            <h2>Adicionar Novo Jogo</h2>
            <div class="settings-group">
                <div class="input-row">
                    <input type="text" id="newGameTitle" placeholder="Título (Ex: God Of War II)">
                    <input type="text" id="newGamePlatform" placeholder="Plataforma (Ex: PS2)">
                    <label>URL / Link da Capa:</label>
                    <input type="text" id="newGameCoverUrl" placeholder="https://exemplo.com/capa.jpg">
                    <div class="cover-tools">
                        <button type="button" onclick="searchSteamGrid('newGameTitle')">🔍 SteamGridDB</button>
                        <button type="button" onclick="searchGoogleImages('newGameTitle')">🌐 Google Imagens</button>
                    </div>
                    <label style="margin-top: 6px;">Emulador / Plataforma:</label>
                    <select id="newGameExecType">
                        <option value="aethersx2">AetherSX2</option>
                        <option value="snes9x">Snes9x EX+</option>
                        <option value="pizzaboy">Pizza Boy</option>
                        <option value="ppsspp">PPSSPP</option>
                        <option value="vita3k">Vita3K+</option>
                        <option value="dolphin">Dolphin Emulator</option>
                        <option value="eden">Eden Legacy (Nintendo Switch)</option>
                        <option value="gamehub">Gamehub (Jogos de PC)</option>
                        <option value="native">Outro App / Nativo</option>
                    </select>
                </div>
                <button type="button" class="modal-btn primary" style="width: 100%; margin-top: 5px;" onclick="addNewGame()">Salvar Jogo</button>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('addGameModal')">Fechar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal Configurar / Excluir Jogo Existente -->
    <div class="modal" id="gameConfigModal">
        <div class="modal-content">
            <h2 id="editGameTitleModal">Configurar Jogo</h2>
            <div class="settings-group">
                <div class="input-row">
                    <label>URL da Capa:</label>
                    <input type="text" id="editGameCoverUrl" placeholder="https://...">
                    <div class="cover-tools">
                        <button type="button" onclick="searchSteamGridEdit()">🔍 SteamGridDB</button>
                        <button type="button" onclick="searchGoogleEdit()">🌐 Google Imagens</button>
                    </div>
                    <label style="margin-top: 6px;">Emulador / Plataforma:</label>
                    <select id="editGameExecType">
                        <option value="aethersx2">AetherSX2</option>
                        <option value="snes9x">Snes9x EX+</option>
                        <option value="pizzaboy">Pizza Boy</option>
                        <option value="ppsspp">PPSSPP</option>
                        <option value="vita3k">Vita3K+</option>
                        <option value="dolphin">Dolphin Emulator</option>
                        <option value="eden">Eden Legacy (Nintendo Switch)</option>
                        <option value="gamehub">Gamehub (Jogos de PC)</option>
                        <option value="native">Outro App / Nativo</option>
                    </select>
                </div>
                <button type="button" class="modal-btn primary" style="width: 100%; margin-top: 5px;" onclick="saveGameConfig()">Salvar Alterações</button>
                <button type="button" class="modal-btn danger" style="width: 100%; margin-top: 8px;" onclick="deleteCurrentGame()">Apagar Jogo</button>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('gameConfigModal')">Cancelar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal Pesquisa (Y) -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h2>Pesquisar Jogo</h2>
            <div class="settings-group">
                <div class="input-row">
                    <input type="text" id="searchInput" placeholder="Digite o nome do jogo..." oninput="filterSearch()">
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('searchModal')">Fechar (B)</button>
            </div>
        </div>
    </div>

    <script>
        let games = [];
        let currentIndex = 0;
        let holdTimer = null;

        let visualPrefs = {
            width: 180,
            radius: '10px',
            color: '#ffffff'
        };

        const carousel = document.getElementById('carousel');
        const gameTitle = document.getElementById('gameTitle');

        function loadData() {
            try {
                const savedGames = localStorage.getItem('nexus_games');
                if (savedGames) games = JSON.parse(savedGames);

                const savedPrefs = localStorage.getItem('nexus_visual_prefs');
                if (savedPrefs) visualPrefs = JSON.parse(savedPrefs);
            } catch(e) {}
            applyVisualPrefs();
        }

        function saveData() {
            try {
                localStorage.setItem('nexus_games', JSON.stringify(games));
                localStorage.setItem('nexus_visual_prefs', JSON.stringify(visualPrefs));
            } catch(e) {}
        }

        function applyVisualPrefs() {
            document.documentElement.style.setProperty('--card-width', visualPrefs.width + 'px');
            document.documentElement.style.setProperty('--card-height', (visualPrefs.width * 1.44) + 'px');
            
            let rad = visualPrefs.radius === '50%circular' ? '50%' : visualPrefs.radius;
            document.documentElement.style.setProperty('--card-radius', rad);
            document.documentElement.style.setProperty('--select-color', visualPrefs.color);

            if (document.getElementById('cardWidthRange')) document.getElementById('cardWidthRange').value = visualPrefs.width;
            if (document.getElementById('sizeVal')) document.getElementById('sizeVal').textContent = visualPrefs.width;
            if (document.getElementById('cardRadiusSelect')) document.getElementById('cardRadiusSelect').value = visualPrefs.radius;
            if (document.getElementById('selectColorPicker')) document.getElementById('selectColorPicker').value = visualPrefs.color;
        }

        function updateCardSize(val) {
            visualPrefs.width = parseInt(val);
            applyVisualPrefs();
            saveData();
        }

        function updateCardRadius(val) {
            visualPrefs.radius = val;
            applyVisualPrefs();
            saveData();
        }

        function updateSelectColor(val) {
            visualPrefs.color = val;
            applyVisualPrefs();
            saveData();
        }

        function renderGames() {
            carousel.innerHTML = '';

            // Card 0: Adicionar Jogo (+)
            const addCard = document.createElement('div');
            addCard.className = `add-card ${currentIndex === 0 ? 'selected' : ''}`;
            addCard.innerHTML = `<div class="add-icon">+</div><div class="add-text">Adicionar Jogo</div>`;
            addCard.onclick = () => {
                currentIndex = 0;
                updateSelection();
                openModal('addGameModal');
            };
            carousel.appendChild(addCard);

            // Jogos Cadastrados
            games.forEach((game, index) => {
                const cardIndex = index + 1;
                const card = document.createElement('div');
                card.className = `game-card ${cardIndex === currentIndex ? 'selected' : ''}`;
                card.innerHTML = `
                    <img src="${game.cover || ''}" alt="${game.title}">
                    <div class="platform-badge">${game.platform}</div>
                `;

                card.onclick = () => {
                    currentIndex = cardIndex;
                    updateSelection();
                };

                card.oncontextmenu = (e) => {
                    e.preventDefault();
                    openGameConfig(index);
                };

                let pTimer;
                card.ontouchstart = () => {
                    pTimer = setTimeout(() => openGameConfig(index), 700);
                };
                card.ontouchend = () => clearTimeout(pTimer);

                carousel.appendChild(card);
            });

            updateSelection();
        }

        function updateSelection() {
            const cards = carousel.querySelectorAll('.add-card, .game-card');
            cards.forEach((card, index) => {
                if (index === currentIndex) {
                    card.classList.add('selected');
                    card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                } else {
                    card.classList.remove('selected');
                }
            });

            if (currentIndex === 0) {
                gameTitle.textContent = "Adicionar Novo Jogo";
            } else if (games[currentIndex - 1]) {
                gameTitle.textContent = games[currentIndex - 1].title;
            }
        }

        function addNewGame() {
            const title = document.getElementById('newGameTitle').value.trim();
            const platform = document.getElementById('newGamePlatform').value.trim();
            const url = document.getElementById('newGameCoverUrl').value.trim();
            const execType = document.getElementById('newGameExecType').value;

            if (!title || !platform) {
                alert("Por favor, informe ao menos o Título e a Plataforma.");
                return;
            }

            games.push({ title, platform, cover: url, execType });
            saveData();
            currentIndex = games.length;
            renderGames();
            closeModal('addGameModal');

            document.getElementById('newGameTitle').value = '';
            document.getElementById('newGamePlatform').value = '';
            document.getElementById('newGameCoverUrl').value = '';
        }

        function openGameConfig(index) {
            currentIndex = index + 1;
            const game = games[index];
            document.getElementById('editGameTitleModal').textContent = `Configurar: ${game.title}`;
            document.getElementById('editGameCoverUrl').value = game.cover || '';
            document.getElementById('editGameExecType').value = game.execType || 'aethersx2';
            openModal('gameConfigModal');
        }

        function saveGameConfig() {
            const gIndex = currentIndex - 1;
            if (games[gIndex]) {
                games[gIndex].cover = document.getElementById('editGameCoverUrl').value.trim();
                games[gIndex].execType = document.getElementById('editGameExecType').value;
                saveData();
                renderGames();
            }
            closeModal('gameConfigModal');
        }

        function deleteCurrentGame() {
            const gIndex = currentIndex - 1;
            if (confirm("Deseja apagar este jogo?")) {
                games.splice(gIndex, 1);
                currentIndex = 0;
                saveData();
                renderGames();
                closeModal('gameConfigModal');
            }
        }

        function launchGame() {
            if (currentIndex === 0 || games.length === 0) {
                openModal('addGameModal');
                return;
            }
            const game = games[currentIndex - 1];
            const emus = {
                'aethersx2': 'AetherSX2 (PS2)',
                'snes9x': 'Snes9x EX+ (SNES)',
                'pizzaboy': 'Pizza Boy',
                'ppsspp': 'PPSSPP (PSP)',
                'vita3k': 'Vita3K+',
                'dolphin': 'Dolphin Emulator',
                'eden': 'Eden Legacy (Switch)',
                'gamehub': 'Gamehub (PC)',
                'native': 'App Nativo'
            };
            alert(`Iniciando ${game.title}\nPlataforma: ${emus[game.execType] || 'Emulador'}`);
        }

        /* Buscas de Capas */
        function searchSteamGrid(inputId) {
            const val = document.getElementById(inputId).value.trim();
            window.open(`https://www.steamgriddb.com/search/grids?term=${encodeURIComponent(val)}`, '_blank');
        }

        function searchGoogleImages(inputId) {
            const val = document.getElementById(inputId).value.trim();
            window.open(`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(val + ' cover png')}`, '_blank');
        }

        function searchSteamGridEdit() {
            if (games[currentIndex - 1]) searchSteamGridTitle(games[currentIndex - 1].title);
        }

        function searchGoogleEdit() {
            if (games[currentIndex - 1]) searchGoogleImagesTitle(games[currentIndex - 1].title);
        }

        function searchSteamGridTitle(t) { window.open(`https://www.steamgriddb.com/search/grids?term=${encodeURIComponent(t)}`, '_blank'); }
        function searchGoogleImagesTitle(t) { window.open(`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(t + ' cover png')}`, '_blank'); }

        /* Ações de Controle e Rodapé */
        function handleActionA() {
            if (document.querySelector('.modal.active')) return;
            if (currentIndex === 0) openModal('addGameModal');
            else launchGame();
        }

        function handleActionB() {
            const activeModal = document.querySelector('.modal.active');
            if (activeModal) activeModal.classList.remove('active');
        }

        function handleActionY() {
            if (document.querySelector('.modal.active')) return;
            openModal('searchModal');
            document.getElementById('searchInput').value = '';
            filterSearch();
        }

        function handleActionX() {
            if (document.querySelector('.modal.active') || games.length === 0) return;
            currentIndex = Math.floor(Math.random() * games.length) + 1;
            updateSelection();
        }

        function openSettingsModal() { openModal('settingsModal'); }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function filterSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const res = document.getElementById('searchResults');
            res.innerHTML = '';

            const list = games.map((g, i) => ({ ...g, idx: i + 1 })).filter(g => g.title.toLowerCase().includes(q));
            if (list.length === 0) {
                res.innerHTML = '<div style="color:#777; padding:5px;">Nenhum jogo encontrado.</div>';
                return;
            }

            list.forEach(item => {
                const div = document.createElement('div');
                div.className = 'search-item';
                div.textContent = `${item.title} (${item.platform})`;
                div.onclick = () => {
                    currentIndex = item.idx;
                    updateSelection();
                    closeModal('searchModal');
                };
                res.appendChild(div);
            });
        }

        /* Atalhos de Teclado */
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') { handleActionB(); return; }
            if (document.querySelector('.modal.active')) return;

            const max = games.length;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                if (currentIndex > 0) { currentIndex--; updateSelection(); }
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                if (currentIndex < max) { currentIndex++; updateSelection(); }
            } else if (e.key === 'Enter' || e.key === ' ') {
                handleActionA();
            } else if (e.key === 'x' || e.key === 'X') {
                handleActionX();
            } else if (e.key === 'y' || e.key === 'Y') {
                handleActionY();
            }
        });

        // Segurar A abre configuração
        window.addEventListener('keydown', (e) => {
            if ((e.key === 'Enter' || e.key === ' ') && !holdTimer && currentIndex > 0 && !document.querySelector('.modal.active')) {
                holdTimer = setTimeout(() => openGameConfig(currentIndex - 1), 800);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
            }
        });

        function requestFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        function updateBattery() {
            const batteryEl = document.getElementById('batteryLevel');
            if ('getBattery' in navigator) {
                navigator.getBattery().then(b => {
                    batteryEl.textContent = `${Math.round(b.level * 100)}%`;
                    b.addEventListener('levelchange', () => batteryEl.textContent = `${Math.round(b.level * 100)}%`);
                }).catch(() => batteryEl.textContent = "100%");
            } else {
                batteryEl.textContent = "100%";
            }
        }

        // Inicialização
        loadData();
        renderGames();
        updateBattery();
    </script>
</body>
</html>
