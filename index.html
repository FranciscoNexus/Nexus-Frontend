<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Frontend v0.23 Stable</title>
    <style>
        :root {
            --cw-p: 150px;
            --ch-p: 216px;
            --cw-l: 220px;
            --ch-l: 316px;
            --card-radius: 10px;
            --select-color: #007AFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
        }

        .top-fade {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95) 40%, rgba(0,0,0,0));
            pointer-events: none;
            z-index: 15;
        }

        .bottom-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 40%, rgba(0,0,0,0));
            pointer-events: none;
            z-index: 15;
        }

        .top-bar {
            display: flex;
            z-index: 20;
            background: rgba(0,0,0,0.6);
        }

        .top-bar.portrait {
            flex-direction: column;
            padding: 10px 15px;
            gap: 6px;
            min-height: 75px;
        }
        .top-bar.portrait .top-row-1, .top-bar.portrait .top-row-2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .top-bar.portrait .game-title { max-width: 50vw; }

        .top-bar.landscape {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 10px 25px;
            min-height: 55px;
        }
        .top-bar.landscape .top-left-group {
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 50vw;
        }
        .top-bar.landscape .game-title { max-width: 35vw; }

        .orientation-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        .game-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-right-group {
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 21;
        }

        .battery-display {
            font-size: 11px;
            font-weight: 600;
            color: #dddddd;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 6px;
            border-radius: 6px;
        }

        .top-ctrl-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
        }

        .carousel-container {
            flex: 1;
            overflow: auto;
            padding: 65px 15px;
            scrollbar-width: none;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar { display: none; }

        .carousel-container.portrait {
            display: grid;
            grid-template-columns: repeat(2, var(--cw-p));
            justify-content: center;
            gap: 12px;
        }

        .carousel-container.landscape {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-left: 30px;
            padding-right: 30px;
        }

        .game-card {
            flex: 0 0 auto;
            border-radius: var(--card-radius);
            overflow: hidden;
            background-color: #111;
            border: 3px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            position: relative;
            cursor: pointer;
        }

        .portrait .game-card { width: var(--cw-p); height: var(--ch-p); }
        .landscape .game-card { width: var(--cw-l); height: var(--ch-l); }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .game-card.selected {
            transform: scale(1.06) translateY(-2px);
            border-color: var(--select-color);
            box-shadow: 0 10px 25px var(--select-color);
            z-index: 5;
        }

        .platform-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 8px;
            font-weight: bold;
            padding: 3px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .favorite-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            font-size: 12px;
            z-index: 2;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
        }

        .recent-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            font-size: 14px;
            z-index: 2;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
        }

        .add-card {
            flex: 0 0 auto;
            border-radius: var(--card-radius);
            background-color: rgba(255, 255, 255, 0.05);
            border: 3px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .portrait .add-card { width: var(--cw-p); height: var(--ch-p); }
        .landscape .add-card { width: var(--cw-l); height: var(--ch-l); }
        .add-card.selected { border-color: var(--select-color); transform: scale(1.05); background: rgba(255, 255, 255, 0.12); }
        .add-icon { font-size: 38px; color: #aaa; }
        .add-text { font-size: 11px; color: #aaa; font-weight: bold; }

        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 8px 15px;
            font-size: 11px;
            color: #aaaaaa;
            background: rgba(0,0,0,0.95);
            z-index: 20;
            min-height: 45px;
        }

        .button-hint { display: flex; align-items: center; gap: 4px; cursor: pointer; padding: 3px 6px; border-radius: 6px; }
        .btn-icon { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; font-weight: bold; font-size: 9px; color: #000; }
        .btn-a { background-color: #4CD964; }
        .btn-b { background-color: #FF3B30; color: #fff; }
        .btn-x { background-color: #007AFF; color: #fff; }
        .btn-y { background-color: #FFCC00; }

        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.88);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: #161618;
            border: 1px solid #333;
            padding: 12px 16px;
            border-radius: 12px;
            width: 92%;
            max-width: 440px;
            max-height: 88vh;
            overflow-y: auto;
            text-align: center;
            box-sizing: border-box;
        }
        .modal-content h2 { margin-bottom: 8px; font-size: 15px; }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            text-align: left;
            margin-bottom: 8px;
        }

        .settings-box {
            background: rgba(255,255,255,0.03);
            padding: 8px;
            border-radius: 6px;
        }
        .settings-box h3 { font-size: 10px; color: #888; margin-bottom: 4px; text-transform: uppercase; }

        .input-row { display: flex; flex-direction: column; gap: 3px; margin-bottom: 5px; }
        .input-row input, .input-row select {
            background: #222; border: 1px solid #444; color: white; padding: 5px; border-radius: 4px; font-size: 11px; width: 100%;
        }
        .input-row label { font-size: 10px; color: #aaa; }

        .cover-tools { display: flex; gap: 4px; margin-top: 2px; }
        .cover-tools button {
            flex: 1; background: #2b2b2b; color: #fff; border: 1px solid #444; padding: 4px; border-radius: 3px; font-size: 10px; cursor: pointer;
        }

        .color-grid { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
        .color-swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-swatch.active { border-color: #fff; transform: scale(1.1); }

        .modal-actions { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
        .modal-btn { background: #333; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .modal-btn.primary { background: #007AFF; }
        .modal-btn.danger { background: #FF3B30; }
        .modal-btn.warning { background: #FF9500; }

        @media (max-width: 480px) {
            .settings-grid { grid-template-columns: 1fr; }
            .modal-content { width: 95%; padding: 10px; max-height: 90vh; }
        }
    </style>
</head>
<body onclick="requestFullscreen()">

    <div class="top-fade"></div>
    <div class="top-bar" id="topBarElement"></div>

    <div class="carousel-container" id="carousel"></div>

    <div class="bottom-fade"></div>
    <div class="bottom-bar">
        <div class="button-hint" onclick="handleActionA()"><span class="btn-icon btn-a">A</span> Abrir</div>
        <div class="button-hint" onclick="handleActionB()"><span class="btn-icon btn-b">B</span> Voltar</div>
        <div class="button-hint" onclick="handleActionY()"><span class="btn-icon btn-y">Y</span> Pesquisar</div>
        <div class="button-hint" onclick="handleActionX()"><span class="btn-icon btn-x">X</span> Aleatório</div>
    </div>

    <!-- Modal Configurações -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2 id="settingsModalTitle">Configurações do Nexus v0.23</h2>
            <div class="settings-grid">
                <div class="settings-box">
                    <h3 id="layoutSliderTitle">Ajuste de Tamanho</h3>
                    <div class="input-row" id="portraitSliderRow" style="display:none;">
                        <label>Retrato (W): <span id="sizeValP">150</span>px</label>
                        <input type="range" id="sizeRangeP" min="100" max="200" value="150" oninput="updatePortraitSize(this.value)">
                    </div>
                    <div class="input-row" id="landscapeSliderRow" style="display:none;">
                        <label>Paisagem (W): <span id="sizeValL">220</span>px</label>
                        <input type="range" id="sizeRangeL" min="150" max="300" value="220" oninput="updateLandscapeSize(this.value)">
                    </div>
                    <div class="input-row" style="margin-top:6px;">
                        <label>Cantos das Capas:</label>
                        <select id="cardRadiusSelect" onchange="updateCardRadius(this.value)">
                            <option value="0px">Retos</option>
                            <option value="10px" selected>Padrão</option>
                            <option value="20px">Redondo</option>
                            <option value="50%circular">Circular</option>
                        </select>
                    </div>
                </div>
                <div class="settings-box">
                    <h3>Cor da Borda</h3>
                    <div class="input-row">
                        <label>Escolher Cor:</label>
                        <div class="color-grid" id="colorGrid">
                            <div class="color-swatch" style="background:#007AFF;" onclick="selectColor('#007AFF')"></div>
                            <div class="color-swatch" style="background:#4CD964;" onclick="selectColor('#4CD964')"></div>
                            <div class="color-swatch" style="background:#FF9500;" onclick="selectColor('#FF9500')"></div>
                            <div class="color-swatch" style="background:#FF3B30;" onclick="selectColor('#FF3B30')"></div>
                            <div class="color-swatch" style="background:#AF52DE;" onclick="selectColor('#AF52DE')"></div>
                            <div class="color-swatch" style="background:#FFCC00;" onclick="selectColor('#FFCC00')"></div>
                            <div class="color-swatch" style="background:#ffffff;" onclick="selectColor('#ffffff')"></div>
                        </div>
                    </div>
                    <div class="input-row" style="margin-top:6px;">
                        <label>Novo Gênero:</label>
                        <div style="display:flex; gap:4px;">
                            <input type="text" id="customGenreInput" placeholder="Gênero" style="flex:1;">
                            <button type="button" class="modal-btn warning" style="padding:4px;" onclick="addCustomGenre()">+</button>
                        </div>
                    </div>
                </div>
            </div>
            <div style="padding:6px; background:rgba(255,255,255,0.03); border-radius:6px; text-align:left; margin-bottom:6px;">
                <h3 style="font-size:10px; color:#888; margin-bottom:4px;">Backup e Reset</h3>
                <div style="display:flex; gap:6px;">
                    <button type="button" class="modal-btn primary" style="flex:1; padding:4px;" onclick="exportBackup()">Exportar</button>
                    <button type="button" class="modal-btn warning" style="flex:1; padding:4px;" onclick="document.getElementById('importFile').click()">Importar</button>
                    <button type="button" class="modal-btn danger" style="flex:1; padding:4px;" onclick="confirmResetList()">Resetar</button>
                    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackup(event)">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('settingsModal')">Fechar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal Adicionar Jogo -->
    <div class="modal" id="addGameModal">
        <div class="modal-content">
            <h2>Adicionar Novo Jogo</h2>
            <div class="settings-grid">
                <div class="settings-box">
                    <div class="input-row">
                        <label>Título:</label>
                        <input type="text" id="newGameTitle" placeholder="Ex: God Of War II">
                    </div>
                    <div class="input-row">
                        <label>Plataforma:</label>
                        <select id="newGamePlatform"></select>
                    </div>
                    <div class="input-row">
                        <label>Gênero:</label>
                        <select id="newGameGenre"></select>
                    </div>
                </div>
                <div class="settings-box">
                    <div class="input-row">
                        <label>URL da Capa:</label>
                        <input type="text" id="newGameCoverUrl" placeholder="https://...">
                        <div class="cover-tools">
                            <button type="button" onclick="searchSteamGrid('newGameTitle')">🔍 SteamGrid</button>
                        </div>
                    </div>
                    <div class="input-row">
                        <label>Emulador:</label>
                        <select id="newGameExecType">
                            <option value="aethersx2">AetherSX2 (PS2)</option>
                            <option value="snes9x">Snes9x (SNES)</option>
                            <option value="pizzaboy">Pizza Boy (GBA)</option>
                            <option value="ppsspp">PPSSPP (PSP)</option>
                            <option value="vita3k">Vita3K (PS Vita)</option>
                            <option value="dolphin">Dolphin (GC/Wii)</option>
                            <option value="eden">Eden (Switch)</option>
                            <option value="gamehub">Gamehub (PC)</option>
                            <option value="native">Nativo</option>
                        </select>
                    </div>
                </div>
            </div>
            <button type="button" class="modal-btn primary" style="width: 100%; margin-top: 4px;" onclick="addNewGame()">Salvar Jogo</button>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('addGameModal')">Cancelar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal Configurar / Excluir Jogo -->
    <div class="modal" id="gameConfigModal">
        <div class="modal-content">
            <h2 id="editGameTitleModal">Configurar Jogo</h2>
            <div class="settings-grid">
                <div class="settings-box">
                    <div class="input-row">
                        <label>Plataforma:</label>
                        <select id="editGamePlatform"></select>
                    </div>
                    <div class="input-row">
                        <label>Gênero:</label>
                        <select id="editGameGenre"></select>
                    </div>
                    <div class="input-row" style="flex-direction: row; align-items: center; gap: 6px; margin-top: 8px;">
                        <input type="checkbox" id="editGameFavorite" style="width: 16px; height: 16px;">
                        <label for="editGameFavorite" style="color: #ffae00; font-weight: bold;">Favorito ⭐</label>
                    </div>
                </div>
                <div class="settings-box">
                    <div class="input-row">
                        <label>URL da Capa:</label>
