<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Frontend</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 35px;
            z-index: 10;
        }

        .game-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .top-right-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .battery-display {
            font-size: 15px;
            font-weight: 600;
            color: #dddddd;
            background: rgba(255, 255, 255, 0.08);
            padding: 5px 10px;
            border-radius: 6px;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .settings-btn:hover, .settings-btn.selected {
            background: rgba(255, 255, 255, 0.25);
            outline: 2px solid #ffffff;
        }

        .carousel-container {
            flex: 1;
            display: flex;
            align-items: center;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 0 40px;
            gap: 25px;
            scrollbar-width: none;
        }

        .carousel-container::-webkit-scrollbar {
            display: none;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: #666;
            font-size: 18px;
        }

        .game-card {
            flex: 0 0 auto;
            width: 220px;
            height: 310px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #111;
            border: 3px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            position: relative;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-card.selected {
            transform: scale(1.15) translateY(-8px);
            border-color: #ffffff;
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.2);
            z-index: 5;
        }

        .platform-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 12px;
            font-size: 13px;
            color: #aaaaaa;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
        }

        .button-hint {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 11px;
            color: #000;
        }

        .btn-a { background-color: #4CD964; }
        .btn-b { background-color: #FF3B30; color: #fff; }
        .btn-x { background-color: #007AFF; color: #fff; }
        .btn-y { background-color: #FFCC00; }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #161618;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 14px;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
        }

        .modal-content h2 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .settings-group {
            text-align: left;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
        }

        .settings-group h3 {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
        }

        .input-row input, .input-row select {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .input-row label {
            font-size: 12px;
            color: #aaa;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .modal-btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.2s;
        }

        .modal-btn:hover { background: #444; }
        .modal-btn.primary { background: #007AFF; }
        .modal-btn.primary:hover { background: #0a84ff; }
        .modal-btn.danger { background: #FF3B30; }
    </style>
</head>
<body onclick="requestFullscreen()">

    <div class="top-bar">
        <div class="game-title" id="gameTitle">Nenhum Jogo Cadastrado</div>
        <div class="top-right-group">
            <div class="battery-display" id="batteryLevel">--%</div>
            <button class="settings-btn" id="settingsBtn" title="Configurações">⚙</button>
        </div>
    </div>

    <div class="carousel-container" id="carousel"></div>

    <div class="bottom-bar">
        <div class="button-hint"><span class="btn-icon btn-a">A</span> Abrir / Segurar (Config)</div>
        <div class="button-hint"><span class="btn-icon btn-b">B</span> Voltar</div>
        <div class="button-hint"><span class="btn-icon btn-y">Y</span> Adicionar Jogo</div>
        <div class="button-hint"><span class="btn-icon btn-x">X</span> Config</div>
    </div>

    <!-- Modal Adicionar Jogo -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>Adicionar Novo Jogo</h2>
            <div class="settings-group">
                <div class="input-row">
                    <input type="text" id="newGameTitle" placeholder="Título (Ex: God Of War II)">
                    <input type="text" id="newGamePlatform" placeholder="Plataforma (Ex: PS2)">
                    <label>Capa do Jogo (Galeria do Celular):</label>
                    <input type="file" id="newGameCoverFile" accept="image/*">
                    <label>Tipo de Execução:</label>
                    <select id="newGameExecType">
                        <option value="aethersx2">AetherSX2 (PS2)</option>
                        <option value="native">App Nativo / Outro Emulador</option>
                    </select>
                    <input type="text" id="newGameExecPath" placeholder="Nome do pacote ou URI (Ex: xyz.aethersx2.android)">
                </div>
                <button class="modal-btn primary" style="width: 100%" onclick="addNewGame()">Salvar Jogo</button>
            </div>
            <div class="modal-actions">
                <button class="modal-btn" onclick="toggleSettings(false)">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal Configuração Individual -->
    <div class="modal" id="gameConfigModal">
        <div class="modal-content">
            <h2 id="editGameTitleModal">Configurar Jogo</h2>
            <div class="settings-group">
                <div class="input-row">
                    <label>Alterar Capa:</label>
                    <input type="file" id="editGameCoverFile" accept="image/*">
                    <label>Tipo de Execução:</label>
                    <select id="editGameExecType">
                        <option value="aethersx2">AetherSX2 (PS2)</option>
                        <option value="native">App Nativo / Outro</option>
                    </select>
                    <label>Pacote do Emulador / App:</label>
                    <input type="text" id="editGameExecPath" placeholder="Ex: xyz.aethersx2.android">
                </div>
                <button class="modal-btn primary" style="width: 100%" onclick="saveGameConfig()">Salvar Alterações</button>
                <button class="modal-btn danger" style="width: 100%; margin-top: 10px;" onclick="deleteCurrentGame()">Remover Jogo</button>
            </div>
            <div class="modal-actions">
                <button class="modal-btn" onclick="closeGameConfig()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const sfx = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            play(type) {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;

                if (type === 'nav') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'select') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                }
            }
        };

        function requestFullscreen() {
            sfx.init();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        let games = [];
        let currentIndex = 0;
        let isSettingsOpen = false;
        let isGameConfigOpen = false;
        let holdTimer = null;

        const carousel = document.getElementById('carousel');
        const gameTitle = document.getElementById('gameTitle');
        const settingsModal = document.getElementById('settingsModal');
        const gameConfigModal = document.getElementById('gameConfigModal');

        function loadData() {
            const savedGames = localStorage.getItem('nexus_games');
            if (savedGames) games = JSON.parse(savedGames);
        }

        function saveData() {
            localStorage.setItem('nexus_games', JSON.stringify(games));
        }

        function renderGames() {
            carousel.innerHTML = '';
            if (games.length === 0) {
                carousel.innerHTML = '<div class="empty-state">Nenhum jogo cadastrado.<br>Pressione Y ou clique na engrenagem ⚙ para adicionar.</div>';
                gameTitle.textContent = "Nenhum Jogo Cadastrado";
                return;
            }

            games.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = `game-card ${index === currentIndex ? 'selected' : ''}`;
                card.innerHTML = `
                    <img src="${game.cover || ''}" alt="${game.title}">
                    <div class="platform-badge">${game.platform}</div>
                `;
                
                card.onclick = (e) => {
                    e.stopPropagation();
                    currentIndex = index;
                    updateSelection();
                    saveData();
                    sfx.play('select');
                };

                card.oncontextmenu = (e) => {
                    e.preventDefault();
                    openGameConfig(index);
                };

                carousel.appendChild(card);
            });
            updateSelection();
        }

        function updateSelection() {
            if (games.length === 0) return;
            const cards = carousel.querySelectorAll('.game-card');
            cards.forEach((card, index) => {
                if (index === currentIndex) {
                    card.classList.add('selected');
                    card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                } else {
                    card.classList.remove('selected');
                }
            });
            if (games[currentIndex]) {
                gameTitle.textContent = games[currentIndex].title;
            }
        }

        function getBase64(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => callback(reader.result);
            reader.onerror = error => console.log('Erro ao ler imagem: ', error);
        }

        function addNewGame() {
            const title = document.getElementById('newGameTitle').value;
            const platform = document.getElementById('newGamePlatform').value;
            const fileInput = document.getElementById('newGameCoverFile');
            const execType = document.getElementById('newGameExecType').value;
            const execPath = document.getElementById('newGameExecPath').value;

            if (!title || !platform) {
                alert("Preencha ao menos o Título e a Plataforma.");
                return;
            }

            const processAdd = (coverBase64) => {
                games.push({ title, platform, cover: coverBase64 || '', execType, execPath });
                saveData();
                renderGames();
                toggleSettings(false);
                sfx.play('select');

                document.getElementById('newGameTitle').value = '';
                document.getElementById('newGamePlatform').value = '';
                document.getElementById('newGameCoverFile').value = '';
                document.getElementById('newGameExecPath').value = '';
            };

            if (fileInput.files && fileInput.files[0]) {
                getBase64(fileInput.files[0], processAdd);
            } else {
                processAdd('');
            }
        }

        function openGameConfig(index) {
            currentIndex = index;
            const game = games[currentIndex];
            document.getElementById('editGameTitleModal').textContent = `Configurar: ${game.title}`;
            document.getElementById('editGameExecType').value = game.execType || 'aethersx2';
            document.getElementById('editGameExecPath').value = game.execPath || '';
            gameConfigModal.classList.add('active');
            isGameConfigOpen = true;
            sfx.play('select');
        }

        function closeGameConfig() {
            gameConfigModal.classList.remove('active');
            isGameConfigOpen = false;
        }

        function saveGameConfig() {
            const fileInput = document.getElementById('editGameCoverFile');
            const execType = document.getElementById('editGameExecType').value;
            const execPath = document.getElementById('editGameExecPath').value;

            games[currentIndex].execType = execType;
            games[currentIndex].execPath = execPath;

            const updateAndClose = () => {
                saveData();
                renderGames();
                closeGameConfig();
                    sfx.play('select');
            };

            if (fileInput.files && fileInput.files[0]) {
                getBase64(fileInput.files[0], (base64) => {
                    games[currentIndex].cover = base64;
                    updateAndClose();
                });
            } else {
                updateAndClose();
            }
        }

        function deleteCurrentGame() {
            if (confirm("Deseja realmente remover este jogo?")) {
                games.splice(currentIndex, 1);
                if (currentIndex >= games.length) currentIndex = Math.max(0, games.length - 1);
                saveData();
                renderGames();
                closeGameConfig();
            }
        }

        function launchGame() {
            if (games.length === 0) return;
            const game = games[currentIndex];
            sfx.play('select');
            
            if (game.execType === 'aethersx2') {
                // Tenta disparar o Intent direto para abrir o AetherSX2 no Android
                // Pacote padrão do AetherSX2: xyz.aethersx2.android
                window.location.href = "intent://#Intent;package=xyz.aethersx2.android;end;";
            } else if (game.execPath) {
                window.location.href = game.execPath;
            } else {
                alert(`Iniciando: ${game.title}`);
            }
        }

        window.addEventListener('keydown', (e) => {
            requestFullscreen();
            if (isSettingsOpen || isGameConfigOpen) {
                if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') {
                    toggleSettings(false);
                    closeGameConfig();
                }
                return;
            }

            if (e.key === 'ArrowLeft' || e.key === 'a') {
                if (games.length > 0 && currentIndex > 0) {
                    currentIndex--;
                    updateSelection();
                    sfx.play('nav');
                }
            } else if (e.key === 'ArrowRight' || e.key === 'd') {
                if (games.length > 0 && currentIndex < games.length - 1) {
                    currentIndex++;
                    updateSelection();
                    sfx.play('nav');
                }
            } else if (e.key === 'Enter' || e.key === ' ') {
                launchGame();
            } else if (e.key === 'x' || e.key === 'X') {
                toggleSettings(true);
            } else if (e.key === 'y' || e.key === 'Y') {
                toggleSettings(true);
            }
        });

        window.addEventListener('keydown', (e) => {
            if ((e.key === 'Enter' || e.key === ' ') && !holdTimer && games.length > 0 && !isSettingsOpen && !isGameConfigOpen) {
                holdTimer = setTimeout(() => {
                    openGameConfig(currentIndex);
                }, 800);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                if (holdTimer) {
                    clearTimeout(holdTimer);
                    holdTimer = null;
                }
            }
        });

        async function updateBattery() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    function setLevel() {
                        document.getElementById('batteryLevel').textContent = `${Math.round(battery.level * 100)}%`;
                    }
                    setLevel();
                    battery.addEventListener('levelchange', setLevel);
                } catch (e) {
                    document.getElementById('batteryLevel').textContent = "85%";
                }
            } else {
                document.getElementById('batteryLevel').textContent = "85%";
            }
        }

        function toggleSettings(open) {
            isSettingsOpen = open;
            if (open) {
                settingsModal.classList.add('active');
                sfx.play('select');
            } else {
                settingsModal.classList.remove('active');
                sfx.play('back');
            }
        }

        document.getElementById('settingsBtn').onclick = (e) => {
            e.stopPropagation();
            toggleSettings(true);
        };

        loadData();
        renderGames();
        updateBattery();
    </script>
</body>
</html>
