<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Frontend v0.12 - Layout Responsivo</title>
    <style>
        :root {
            --card-width: 180px;
            --card-height: 260px;
            --card-radius: 10px;
            --select-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Topo */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            z-index: 20;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
            min-height: 50px;
        }

        .game-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 45vw;
        }

        .top-right-group {
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 21;
        }

        .battery-display {
            font-size: 12px;
            font-weight: 600;
            color: #dddddd;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 7px;
            border-radius: 6px;
        }

        .top-ctrl-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 7px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .top-ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
        }

        /* Área do Carrossel / Grade */
        .carousel-container {
            flex: 1;
            overflow: auto;
            padding: 15px 25px;
            gap: 20px;
            scrollbar-width: none;
            display: flex;
            align-content: center;
            align-items: center;
        }

        .carousel-container::-webkit-scrollbar {
            display: none;
        }

        /* MODO HORIZONTAL (Landscape) */
        @media (orientation: landscape) {
            .carousel-container {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: flex-start;
                align-content: center;
                max-height: calc(100vh - 100px);
            }
        }

        /* MODO VERTICAL (Portrait) */
        @media (orientation: portrait) {
            .carousel-container {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(var(--card-width), 1fr));
                justify-items: center;
                align-content: start;
                max-height: calc(100vh - 110px);
                gap: 15px;
                padding-top: 10px;
            }
        }

        .game-card {
            flex: 0 0 auto;
            width: var(--card-width);
            height: var(--card-height);
            border-radius: var(--card-radius);
            overflow: hidden;
            background-color: #111;
            border: 3px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            position: relative;
            cursor: pointer;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .game-card.selected {
            transform: scale(1.08) translateY(-3px);
            border-color: var(--select-color);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.25);
            z-index: 5;
        }

        .platform-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 8px;
            font-weight: bold;
            padding: 3px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .favorite-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            font-size: 13px;
            z-index: 2;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
        }

        /* Card de Adicionar Jogo (+) */
        .add-card {
            flex: 0 0 auto;
            width: var(--card-width);
            height: var(--card-height);
            border-radius: var(--card-radius);
            background-color: rgba(255, 255, 255, 0.05);
            border: 3px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .add-card.selected {
            border-color: var(--select-color);
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.12);
        }

        .add-icon { font-size: 42px; color: #aaa; }
        .add-text { font-size: 12px; color: #aaa; font-weight: bold; }

        /* Rodapé */
        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 16px;
            padding: 8px 12px;
            font-size: 11px;
            color: #aaaaaa;
            background: linear-gradient(to top, rgba(0,0,0,0.98), transparent);
            z-index: 10;
            min-height: 45px;
        }

        .button-hint {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 6px;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 9px;
            color: #000;
        }

        .btn-a { background-color: #4CD964; }
        .btn-b { background-color: #FF3B30; color: #fff; }
        .btn-x { background-color: #007AFF; color: #fff; }
        .btn-y { background-color: #FFCC00; }
        .btn-select { background-color: #AF52DE; color: #fff; }
        .btn-start { background-color: #FF9500; color: #fff; }

        /* Modais */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.88);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: #161618;
            border: 1px solid #333;
            padding: 18px;
            border-radius: 12px;
            width: 90%;
            max-width: 440px;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
        }

        .modal-content h2 { margin-bottom: 10px; font-size: 17px; }

        .settings-group {
            text-align: left;
            margin-bottom: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }

        .settings-group h3 {
            font-size: 11px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 8px;
        }

        .input-row input, .input-row select {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 7px;
            border-radius: 6px;
            font-size: 12px;
        }

        .input-row label { font-size: 11px; color: #aaa; }

        .cover-tools {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }
        .cover-tools button {
            flex: 1;
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .search-results, .platform-list {
            max-height: 130px;
            overflow-y: auto;
            margin-top: 8px;
            text-align: left;
        }
        .search-item, .platform-item {
            padding: 7px;
            background: #222;
            margin-bottom: 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-item:hover, .platform-item:hover { background: #333; }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }

        .modal-btn {
            background: #333;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .modal-btn.primary { background: #007AFF; }
        .modal-btn.danger { background: #FF3B30; }
        .modal-btn.warning { background: #FF9500; }
    </style>
</head>
<body onclick="requestFullscreen()">

    <div class="top-bar">
        <div class="game-title" id="gameTitle">Carregando...</div>
        <div class="top-right-group">
            <div class="battery-display" id="batteryLevel">--%</div>
            <button class="top-ctrl-btn" onclick="openSelectFilter()">SELECT</button>
            <button class="top-ctrl-btn" onclick="openStartConfig()">START</button>
            <button class="settings-btn" id="settingsBtn" title="Configurações" onclick="openModal('settingsModal')">⚙</button>
        </div>
    </div>

    <div class="carousel-container" id="carousel"></div>

    <!-- Rodapé -->
    <div class="bottom-bar">
        <div class="button-hint" onclick="handleActionA()"><span class="btn-icon btn-a">A</span> Abrir</div>
        <div class="button-hint" onclick="handleActionB()"><span class="btn-icon btn-b">B</span> Voltar</div>
        <div class="button-hint" onclick="handleActionSelect()"><span class="btn-icon btn-select">SEL</span> Filtro</div>
        <div class="button-hint" onclick="handleActionStart()"><span class="btn-icon btn-start">STA</span> Opções</div>
        <div class="button-hint" onclick="handleActionY()"><span class="btn-icon btn-y">Y</span> Pesquisar</div>
        <div class="button-hint" onclick="handleActionX()"><span class="btn-icon btn-x">X</span> Aleatório</div>
    </div>

    <!-- Modal Configurações Gerais -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>Configurações do Nexus v0.12</h2>
            
            <div class="settings-group">
                <h3>Visual e Dimensões</h3>
                <div class="input-row">
                    <label>Tamanho/Largura das Capas: <span id="sizeVal">180</span>px</label>
                    <input type="range" id="cardWidthRange" min="90" max="240" value="180" oninput="updateCardSize(this.value)">
                </div>
                <div class="input-row">
                    <label>Cantos:</label>
                    <select id="cardRadiusSelect" onchange="updateCardRadius(this.value)">
                        <option value="0px">Retos (0px)</option>
                        <option value="10px" selected>Arredondado (10px)</option>
                        <option value="20px">Super Arredondado (20px)</option>
                        <option value="50%circular">Circular</option>
                    </select>
                </div>
                <div class="input-row">
                    <label>Cor de Seleção:</label>
                    <input type="color" id="selectColorPicker" value="#ffffff" onchange="updateSelectColor(this.value)" style="height: 35px; cursor: pointer;">
                </div>
            </div>

            <div class="settings-group">
                <h3>Gerenciar Plataformas</h3>
                <div class="platform-list" id="platformListContainer"></div>
                <div class="input-row" style="margin-top: 8px;">
                    <input type="text" id="newPlatformName" placeholder="Nova Plataforma (ex: Nintendo 64)">
                    <button type="button" class="modal-btn warning" style="margin-top:4px;" onclick="addNewPlatform()">Adicionar Plataforma</button>
                </div>
            </div>

            <div class="settings-group">
                <h3>Backup e Dados</h3>
                <div style="display:flex; gap:8px;">
                    <button type="button" class="modal-btn primary" style="flex:1;" onclick="exportBackup()">Salvar / Exportar</button>
                    <button type="button" class="modal-btn warning" style="flex:1;" onclick="document.getElementById('importFile').click()">Importar Backup</button>
                    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackup(event)">
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('settingsModal')">Fechar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal Adicionar Jogo -->
    <div class="modal" id="addGameModal">
        <div class="modal-content">
            <h2>Adicionar Novo Jogo</h2>
            <div class="settings-group">
                <div class="input-row">
                    <input type="text" id="newGameTitle" placeholder="Título (Ex: God Of War II)">
                    <select id="newGamePlatform"></select>
                    <input type="text" id="newGameGenre" placeholder="Gênero (Ex: Ação, RPG, Luta)">
                    <label>URL / Link da Capa:</label>
                    <input type="text" id="newGameCoverUrl" placeholder="https://exemplo.com/capa.jpg">
                    <div class="cover-tools">
                        <button type="button" onclick="searchSteamGrid('newGameTitle')">🔍 SteamGridDB</button>
                        <button type="button" onclick="searchGoogleImages('newGameTitle')">🌐 Google Imagens</button>
                    </div>
                    <label style="margin-top: 6px;">Emulador de Execução:</label>
                    <select id="newGameExecType">
                        <option value="aethersx2">AetherSX2 (PS2)</option>
                        <option value="snes9x">Snes9x EX+ (SNES)</option>
                        <option value="pizzaboy">Pizza Boy (GBA)</option>
                        <option value="ppsspp">PPSSPP (PSP)</option>
                        <option value="vita3k">Vita3K+ (PS Vita)</option>
                        <option value="dolphin">Dolphin (GC/Wii)</option>
                        <option value="eden">Eden Legacy (Switch)</option>
                        <option value="gamehub">Gamehub (PC)</option>
                        <option value="native">Outro App / Nativo</option>
                    </select>
                </div>
                <button type="button" class="modal-btn primary" style="width: 100%; margin-top: 5px;" onclick="addNewGame()">Salvar Jogo</button>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('addGameModal')">Fechar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal Configurar / Excluir Jogo -->
    <div class="modal" id="gameConfigModal">
        <div class="modal-content">
            <h2 id="editGameTitleModal">Configurar Jogo</h2>
            <div class="settings-group">
                <div class="input-row">
                    <select id="editGamePlatform"></select>
                    <input type="text" id="editGameGenre" placeholder="Gênero">
                    <label>URL da Capa:</label>
                    <input type="text" id="editGameCoverUrl" placeholder="https://...">
                    <div class="cover-tools">
                        <button type="button" onclick="searchSteamGridEdit()">🔍 SteamGridDB</button>
                        <button type="button" onclick="searchGoogleEdit()">🌐 Google Imagens</button>
                    </div>
                    <label style="margin-top: 6px;">Emulador:</label>
                    <select id="editGameExecType">
                        <option value="aethersx2">AetherSX2 (PS2)</option>
                        <option value="snes9x">Snes9x EX+ (SNES)</option>
                        <option value="pizzaboy">Pizza Boy (GBA)</option>
                        <option value="ppsspp">PPSSPP (PSP)</option>
                        <option value="vita3k">Vita3K+ (PS Vita)</option>
                        <option value="dolphin">Dolphin (GC/Wii)</option>
                        <option value="eden">Eden Legacy (Switch)</option>
                        <option value="gamehub">Gamehub (PC)</option>
                        <option value="native">Outro App / Nativo</option>
                    </select>
                    <div class="input-row" style="flex-direction: row; align-items: center; gap: 8px; margin-top: 6px;">
                        <input type="checkbox" id="editGameFavorite" style="width: 18px; height: 18px; cursor: pointer;">
                        <label for="editGameFavorite" style="font-size: 13px; color: #fff; cursor: pointer;">Marcar como Jogo Favorito ⭐</label>
                    </div>
                </div>
                <button type="button" class="modal-btn primary" style="width: 100%; margin-top: 5px;" onclick="saveGameConfig()">Salvar Alterações</button>
                <button type="button" class="modal-btn danger" style="width: 100%; margin-top: 8px;" onclick="deleteCurrentGame()">Apagar Jogo</button>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('gameConfigModal')">Cancelar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal de Filtros (Select) -->
    <div class="modal" id="filterModal">
        <div class="modal-content">
            <h2>Filtrar Biblioteca</h2>
            <div class="settings-group">
                <div class="input-row" style="flex-direction: row; align-items: center; gap: 8px; margin-bottom: 10px;">
                    <input type="checkbox" id="filterFavor
