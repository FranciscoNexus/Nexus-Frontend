<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Frontend v0.15 Alpha</title>
    <style>
        :root {
            --cw-p: 150px;
            --ch-p: 216px;
            --cw-l: 220px;
            --ch-l: 316px;
            --card-radius: 10px;
            --select-color: #007AFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Efeitos de Esmaecimento (Sombras) */
        .top-fade {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95) 40%, rgba(0,0,0,0));
            pointer-events: none;
            z-index: 15;
        }

        .bottom-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 40%, rgba(0,0,0,0));
            pointer-events: none;
            z-index: 15;
        }

        /* Topo Fixo Dinâmico (Retrato vs Paisagem) */
        .top-bar {
            display: flex;
            z-index: 20;
            background: rgba(0,0,0,0.6);
        }

        /* Modo Retrato: 2 Linhas */
        .top-bar.portrait {
            flex-direction: column;
            padding: 10px 15px;
            gap: 6px;
            min-height: 75px;
        }
        .top-bar.portrait .top-row-1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .top-bar.portrait .top-row-2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .top-bar.portrait .game-title {
            max-width: 50vw;
        }

        /* Modo Paisagem: 1 Linha com Margem de Segurança */
        .top-bar.landscape {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 10px 25px;
            min-height: 55px;
        }
        .top-bar.landscape .top-left-group {
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 50vw;
        }
        .top-bar.landscape .top-right-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-bar.landscape .game-title {
            max-width: 35vw;
        }

        .orientation-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        .game-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-right-group {
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 21;
        }

        .battery-display {
            font-size: 11px;
            font-weight: 600;
            color: #dddddd;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 6px;
            border-radius: 6px;
        }

        .top-ctrl-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
        }

        /* Container de Jogos */
        .carousel-container {
            flex: 1;
            overflow: auto;
            padding: 65px 15px;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }

        .carousel-container::-webkit-scrollbar {
            display: none;
        }

        .carousel-container.portrait {
            display: grid;
            grid-template-columns: repeat(2, var(--cw-p));
            justify-content: center;
            gap: 12px;
        }

        .carousel-container.landscape {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-left: 30px;
            padding-right: 30px;
        }

        .game-card {
            flex: 0 0 auto;
            border-radius: var(--card-radius);
            overflow: hidden;
            background-color: #111;
            border: 3px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            position: relative;
            cursor: pointer;
        }

        .portrait .game-card {
            width: var(--cw-p);
            height: var(--ch-p);
        }

        .landscape .game-card {
            width: var(--cw-l);
            height: var(--ch-l);
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .game-card.selected {
            transform: scale(1.06) translateY(-2px);
            border-color: var(--select-color);
            box-shadow: 0 10px 25px var(--select-color);
            z-index: 5;
        }

        .platform-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 8px;
            font-weight: bold;
            padding: 3px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .favorite-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            font-size: 12px;
            z-index: 2;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
        }

        .recent-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            font-size: 13px;
            z-index: 2;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
        }

        /* Card de Adicionar Jogo (+) */
        .add-card {
            flex: 0 0 auto;
            border-radius: var(--card-radius);
            background-color: rgba(255, 255, 255, 0.05);
            border: 3px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .portrait .add-card {
            width: var(--cw-p);
            height: var(--ch-p);
        }

        .landscape .add-card {
            width: var(--cw-l);
            height: var(--ch-l);
        }

        .add-card.selected {
            border-color: var(--select-color);
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.12);
        }

        .add-icon { font-size: 38px; color: #aaa; }
        .add-text { font-size: 11px; color: #aaa; font-weight: bold; }

        /* Zonas Invisíveis de Navegação Rápida (Metade Esquerda / Metade Direita) */
        .nav-zone-left {
            position: fixed;
            top: 60px;
            left: 0;
            width: 50vw;
            height: calc(100vh - 110px);
            z-index: 5;
            pointer-events: auto;
            cursor: default;
        }

        .nav-zone-right {
            position: fixed;
            top: 60px;
            right: 0;
            width: 50vw;
            height: calc(100vh - 110px);
            z-index: 5;
            pointer-events: auto;
            cursor: default;
        }

        /* Rodapé Fixo */
        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 8px 15px;
            font-size: 11px;
            color: #aaaaaa;
            background: rgba(0,0,0,0.95);
            z-index: 20;
            min-height: 45px;
        }

        .button-hint {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 6px;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 9px;
            color: #000;
        }

        .btn-a { background-color: #4CD964; }
        .btn-b { background-color: #FF3B30; color: #fff; }
        .btn-x { background-color: #007AFF; color: #fff; }
        .btn-y { background-color: #FFCC00; }

        /* Modais Compactos */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.88);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: #161618;
            border: 1px solid #333;
            padding: 12px 16px;
            border-radius: 10px;
            width: 92%;
            max-width: 420px;
            text-align: center;
            overflow: hidden;
        }

        .modal-content h2 { margin-bottom: 8px; font-size: 15px; }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            text-align: left;
            margin-bottom: 8px;
        }

        .settings-box {
            background: rgba(255,255,255,0.03);
            padding: 8px;
            border-radius: 6px;
        }

        .settings-box h3 {
            font-size: 10px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 5px;
        }

        .input-row input, .input-row select {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 5px;
            border-radius: 4px;
            font-size: 11px;
        }

        .input-row label { font-size: 10px; color: #aaa; }

        .cover-tools {
            display: flex;
            gap: 4px;
            margin-top: 2px;
        }
        .cover-tools button {
            flex: 1;
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
            padding: 4px;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
        }

        .color-grid {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .color-swatch {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-swatch.active { border-color: #fff; transform: scale(1.1); }

        .modal-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 6px;
        }

        .modal-btn {
            background: #333;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }
        .modal-btn.primary { background: #007AFF; }
        .modal-btn.danger { background: #FF3B30; }
        .modal-btn.warning { background: #FF9500; }
    </style>
</head>
<body onclick="requestFullscreen()">

    <div class="top-fade"></div>
    <div class="top-bar" id="topBarElement"></div>

    <!-- Zonas invisíveis de navegação rápida -->
    <div class="nav-zone-left" onclick="jumpToStart()"></div>
    <div class="nav-zone-right" onclick="jumpToEnd()"></div>

    <div class="carousel-container" id="carousel"></div>

    <div class="bottom-fade"></div>
    <div class="bottom-bar">
        <div class="button-hint" onclick="handleActionA()"><span class="btn-icon btn-a">A</span> Abrir</div>
        <div class="button-hint" onclick="handleActionB()"><span class="btn-icon btn-b">B</span> Voltar</div>
        <div class="button-hint" onclick="handleActionY()"><span class="btn-icon btn-y">Y</span> Pesquisar</div>
        <div class="button-hint" onclick="handleActionX()"><span class="btn-icon btn-x">X</span> Aleatório</div>
    </div>

    <!-- Modal Configurações Reformulado -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2 id="settingsModalTitle">Configurações do Nexus v0.15</h2>
            <div class="settings-grid">
                <div class="settings-box">
                    <h3 id="layoutSliderTitle">Ajuste de Tamanho</h3>
                    <div class="input-row" id="portraitSliderRow" style="display:none;">
                        <label>Retrato (W): <span id="sizeValP">150</span>px</label>
                        <input type="range" id="sizeRangeP" min="100" max="200" value="150" oninput="updatePortraitSize(this.value)">
                    </div>
                    <div class="input-row" id="landscapeSliderRow" style="display:none;">
                        <label>Paisagem (W): <span id="sizeValL">220</span>px</label>
                        <input type="range" id="sizeRangeL" min="150" max="300" value="220" oninput="updateLandscapeSize(this.value)">
                    </div>
                    <div class="input-row" style="margin-top:6px;">
                        <label>Cantos das Capas:</label>
                        <select id="cardRadiusSelect" onchange="updateCardRadius(this.value)">
                            <option value="0px">Retos</option>
                            <option value="10px" selected>Padrão</option>
                            <option value="20px">Redondo</option>
                            <option value="50%circular">Circular</option>
                        </select>
                    </div>
                </div>
                <div class="settings-box">
                    <h3>Cor da Borda</h3>
                    <div class="input-row">
                        <label>Escolher Cor:</label>
                        <div class="color-grid" id="colorGrid">
                            <div class="color-swatch" style="background:#007AFF;" onclick="selectColor('#007AFF')"></div>
                            <div class="color-swatch" style="background:#4CD964;" onclick="selectColor('#4CD964')"></div>
                            <div class="color-swatch" style="background:#FF9500;" onclick="selectColor('#FF9500')"></div>
                            <div class="color-swatch" style="background:#FF3B30;" onclick="selectColor('#FF3B30')"></div>
                            <div class="color-swatch" style="background:#AF52DE;" onclick="selectColor('#AF52DE')"></div>
                            <div class="color-swatch" style="background:#FFCC00;" onclick="selectColor('#FFCC00')"></div>
                            <div class="color-swatch" style="background:#ffffff;" onclick="selectColor('#ffffff')"></div>
                        </div>
                    </div>
                    <div class="input-row" style="margin-top:6px;">
                        <label>Novo Gênero / Plataforma:</label>
                        <div style="display:flex; gap:4px;">
                            <input type="text" id="customGenreInput" placeholder="Gênero" style="flex:1;">
                            <button type="button" class="modal-btn warning" style="padding:4px;" onclick="addCustomGenre()">+</Genre>
                        </div>
                    </div>
                </div>
            </div>
            <div class="settings-group" style="padding:6px; background:rgba(255,255,255,0.03); border-radius:6px; text-align:left; margin-bottom:6px;">
                <h3 style="font-size:10px; color:#888; margin-bottom:4px;">Backup, Restauração e Reset</h3>
                <div style="display:flex; gap:6px;">
                    <button type="button" class="modal-btn primary" style="flex:1; padding:4px;" onclick="exportBackup()">Exportar</button>
                    <button type="button" class="modal-btn warning" style="flex:1; padding:4px;" onclick="document.getElementById('importFile').click()">Importar</button>
                    <button type="button" class="modal-btn danger" style="flex:1; padding:4px;" onclick="confirmResetList()">Resetar</button>
                    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackup(event)">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('settingsModal')">Fechar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal Adicionar Jogo -->
    <div class="modal" id="addGameModal">
        <div class="modal-content">
            <h2>Adicionar Novo Jogo</h2>
            <div class="settings-grid">
                <div class="settings-box">
                    <div class="input-row">
                        <label>Título:</label>
                        <input type="text" id="newGameTitle" placeholder="Ex: God Of War II">
                    </div>
                    <div class="input-row">
                        <label>Plataforma:</label>
                        <select id="newGamePlatform"></select>
                    </div>
                    <div class="input-row">
                        <label>Gênero:</label>
                        <select id="newGameGenre"></select>
                    </div>
                </div>
                <div class="settings-box">
                    <div class="input-row">
                        <label>URL da Capa:</label>
                        <input type="text" id="newGameCoverUrl" placeholder="https://...">
                        <div class="cover-tools">
                            <button type="button" onclick="autoFetchCover()">⚡ Auto Buscar</button>
                            <button type="button" onclick="searchSteamGrid('newGameTitle')">🔍 SteamGrid</button>
                        </div>
                    </div>
                    <div class="input-row">
                        <label>Emulador:</label>
                        <select id="newGameExecType">
                            <option value="aethersx2">AetherSX2 (PS2)</option>
                            <option value="snes9x">Snes9x (SNES)</option>
                            <option value="pizzaboy">Pizza Boy (GBA)</option>
                            <option value="ppsspp">PPSSPP (PSP)</option>
                            <option value="vita3k">Vita3K (PS Vita)</option>
                            <option value="dolphin">Dolphin (GC/Wii)</option>
                            <option value="eden">Eden (Switch)</option>
                            <option value="gamehub">Gamehub (PC)</option>
                            <option value="native">Nativo</option>
                        </select>
                    </div>
                </div>
            </div>
            <button type="button" class="modal-btn primary" style="width: 100%; margin-top: 4px;" onclick="addNewGame()">Salvar Jogo</button>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('addGameModal')">Cancelar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal Configurar / Excluir Jogo -->
    <div class="modal" id="gameConfigModal">
        <div class="modal-content">
            <h2 id="editGameTitleModal">Configurar Jogo</h2>
            <div class="settings-grid">
                <div class="settings-box">
                    <div class="input-row">
                        <label>Plataforma:</label>
                        <select id="editGamePlatform"></select>
                    </div>
                    <div class="input-row">
                        <label>Gênero:</label>
                        <select id="editGameGenre"></select>
                    </div>
                    <div class="input-row" style="flex-direction: row; align-items: center; gap: 6px; margin-top: 8px;">
                        <input type="checkbox" id="editGameFavorite" style="width: 16px; height: 16px;">
                        <label for="editGameFavorite" style="color: #ffae00; font-weight: bold;">Favorito ⭐</label>
                    </div>
                </div>
                <div class="settings-box">
                    <div class="input-row">
                        <label>URL da Capa:</label>
                        <input type="text" id="editGameCoverUrl" placeholder="https://...">
                        <div class="cover-tools">
                            <button type="button" onclick="autoFetchCoverEdit()">⚡ Auto Buscar</button>
                            <button type="button" onclick="searchSteamGridEdit()">🔍 SteamGrid</button>
                        </div>
                    </div>
                    <div class="input-row">
                        <label>Emulador:</label>
                        <select id="editGameExecType">
                            <option value="aethersx2">AetherSX2 (PS2)</option>
                            <option value="snes9x">Snes9x (SNES)</option>
                            <option value="pizzaboy">Pizza Boy (GBA)</option>
                            <option value="ppsspp">PPSSPP (PSP)</option>
                            <option value="vita3k">Vita3K (PS Vita)</option>
                            <option value="dolphin">Dolphin (GC/Wii)</option>
                            <option value="eden">Eden (Switch)</option>
                            <option value="gamehub">Gamehub (PC)</option>
                            <option value="native">Nativo</option>
                        </select>
                    </div>
                </div>
            </div>
            <div style="display:flex; gap:6px; margin-top:4px;">
                <button type="button" class="modal-btn primary" style="flex:1;" onclick="saveGameConfig()">Salvar</button>
                <button type="button" class="modal-btn danger" style="flex:1;" onclick="deleteCurrentGame()">Apagar</button>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('gameConfigModal')">Cancelar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal de Filtros (Select) -->
    <div class="modal" id="filterModal">
        <div class="modal-content">
            <h2>Filtrar Biblioteca</h2>
            <div class="settings-box" style="text-align: left; margin-bottom: 8px;">
                <div class="input-row" style="flex-direction: row; align-items: center; gap: 6px; margin-bottom: 6px;">
                    <input type="checkbox" id="filterFavoriteOnly" onchange="applyFilter()" style="width: 16px; height: 16px;">
                    <label for="filterFavoriteOnly" style="color: #ffae00; font-weight: bold;">⭐ Apenas Favoritos</label>
                </div>
                <div class="input-row">
                    <label>Plataforma:</label>
                    <select id="filterPlatform" onchange="applyFilter()">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="input-row">
                    <label>Gênero:</label>
                    <select id="filterGenre" onchange="applyFilter()">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="input-row">
                    <label>Ordenação / Exibição:</label>
                    <select id="filterSortOrder" onchange="applyFilter()">
                        <option value="default">Padrão (Recentes > Favoritos > A-Z)</option>
                        <option value="az">Alfabética (A-Z)</option>
                        <option value="za">Alfabética Inversa (Z-A)</option>
                        <option value="recent">Jogados Recentemente</option>
                    </select>
                </div>
            </div>
            <button type="button" class="modal-btn warning" style="width:100%; margin-bottom:4px;" onclick="clearFilter()">Remover Filtros</button>
            <div class="modal-actions">
                <button type="button" class="modal-btn primary" onclick="closeModal('filterModal')">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal Pesquisa (Y) -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h2>Pesquisar Jogo</h2>
            <div class="settings-box" style="text-align: left; margin-bottom: 8px;">
                <input type="text" id="searchInput" placeholder="Digite o nome..." oninput="filterSearch()" style="width:100%; padding:6px; background:#222; border:1px solid #444; color:#fff; border-radius:4px;">
                <div class="search-results" id="searchResults" style="max-height: 100px; overflow-y: auto; margin-top: 6px;"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('searchModal')">Fechar (B)</button>
            </div>
        </div>
    </div>

    <script>
        let games = [];
        let platforms = [
            { name: 'PlayStation 2', active: true },
            { name: 'Super Nintendo', active: true },
            { name: 'Game Boy Advance', active: true },
            { name: 'PSP', active: true },
            { name: 'PS Vita', active: true },
            { name: 'GameCube / Wii', active: true },
            { name: 'Nintendo Switch', active: true },
            { name: 'PC / Gamehub', active: true }
        ];
        let genresList = ['Ação', 'Aventura', 'RPG', 'Corrida', 'Luta', 'Esportes', 'Plataforma', 'Tiro', 'Estratégia', 'Terror', 'Puzzle'];
        let currentIndex = 0;
        let activeFilterPlatform = '';
        let activeFilterGenre = '';
        let activeFilterFavoriteOnly = false;
        let activeSortOrder = 'default';
        let currentOrientation = 'portrait';

        let visualPrefs = { 
            widthP: 150, 
            widthL: 220, 
            radius: '10px', 
            color: '#007AFF' 
        };

        const carousel = document.getElementById('carousel');
        const topBarElement = document.getElementById('topBarElement');

        function loadData() {
            try {
                const savedGames = localStorage.getItem('nexus_games');
                if (savedGames) games = JSON.parse(savedGames);

                const savedPlats = localStorage.getItem('nexus_platforms');
                if (savedPlats) platforms = JSON.parse(savedPlats);

                const savedGenres = localStorage.getItem('nexus_genres');
                if (savedGenres) genresList = JSON.parse(savedGenres);

                const savedPrefs = localStorage.getItem('nexus_visual_prefs');
                if (savedPrefs) visualPrefs = JSON.parse(savedPrefs);

                const savedOrient = localStorage.getItem('nexus_orientation');
                if (savedOrient) currentOrientation = savedOrient;
            } catch(e) {}
            applyVisualPrefs();
            applyOrientationMode();
            populateDropdowns();
        }

        function saveData() {
            try {
                localStorage.setItem('nexus_games', JSON.stringify(games));
                localStorage.setItem('nexus_platforms', JSON.stringify(platforms));
                localStorage.setItem('nexus_genres', JSON.stringify(genresList));
                localStorage.setItem('nexus_visual_prefs', JSON.stringify(visualPrefs));
                localStorage.setItem('nexus_orientation', currentOrientation);
            } catch(e) {}
        }

        function applyVisualPrefs() {
            const wP = visualPrefs.widthP;
            const hP = Math.round(wP * 1.44);
            const wL = visualPrefs.widthL;
            const hL = Math.round(wL * 1.44);

            document.documentElement.style.setProperty('--cw-p', wP + 'px');
            document.documentElement.style.setProperty('--ch-p', hP + 'px');
            document.documentElement.style.setProperty('--cw-l', wL + 'px');
            document.documentElement.style.setProperty('--ch-l', hL + 'px');

            let rad = visualPrefs.radius === '50%circular' ? '50%' : visualPrefs.radius;
            document.documentElement.style.setProperty('--card-radius', rad);
            document.documentElement.style.setProperty('--select-color', visualPrefs.color);

            if (document.getElementById('sizeRangeP')) document.getElementById('sizeRangeP').value = wP;
            if (document.getElementById('sizeValP')) document.getElementById('sizeValP').textContent = wP;
            if (document.getElementById('sizeRangeL')) document.getElementById('sizeRangeL').value = wL;
            if (document.getElementById('sizeValL')) document.getElementById('sizeValL').textContent = wL;
            if (document.getElementById('cardRadiusSelect')) document.getElementById('cardRadiusSelect').value = visualPrefs.radius;

            // Ativa o swatch correto
            document.querySelectorAll('.color-swatch').forEach(sw => {
                if (sw.style.backgroundColor === hexToRgb(visualPrefs.color) || sw.style.backgroundColor === visualPrefs.color) {
                    sw.classList.add('active');
                } else {
                    sw.classList.remove('active');
                }
            });
        }

        function hexToRgb(hex) {
            let c;
            if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
                c= hex.substring(1).split('');
                if(c.length==3){ c= [c[0], c[0], c[1], c[1], c[2], c[2]]; }
                c= '0x'+c.join('');
                return 'rgb('+[(c>>16)&255, (c>>8)&255, c&255].join(', ')+')';
            }
            return hex;
        }

        function updatePortraitSize(val) { visualPrefs.widthP = parseInt(val); applyVisualPrefs(); saveData(); }
        function updateLandscapeSize(val) { visualPrefs.widthL = parseInt(val); applyVisualPrefs(); saveData(); }
        function updateCardRadius(val) { visualPrefs.radius = val; applyVisualPrefs(); saveData(); }
        
        function selectColor(hex) {
            visualPrefs.color = hex;
            applyVisualPrefs();
            saveData();
        }

        function addCustomGenre() {
            const input = document.getElementById('customGenreInput');
            const val = input.value.trim();
            if (!val) return;
            if (!genresList.includes(val)) {
                genresList.push(val);
                saveData();
                populateDropdowns();
                alert(`Gênero "${val}" adicionado com sucesso!`);
            }
            input.value = '';
        }

        function confirmResetList() {
            if (confirm("ATENÇÃO: Deseja realmente apagar toda a lista de jogos cadastrados? Esta ação não pode ser desfeita.")) {
                games = [];
                saveData();
                renderGames();
                closeModal('settingsModal');
                alert("Lista de jogos resetada com sucesso.");
            }
        }

        function toggleOrientationMode() {
            currentOrientation = currentOrientation === 'portrait' ? 'landscape' : 'portrait';
            applyOrientationMode();
            saveData();
            renderGames();
        }

        function applyOrientationMode() {
            if (currentOrientation === 'portrait') {
                carousel.className = 'carousel-container portrait';
                topBarElement.className = 'top-bar portrait';
                topBarElement.innerHTML = `
                    <div class="top-row-1">
                        <button class="orientation-btn" onclick="toggleOrientationMode()">📱 Retrato</button>
                        <div class="top-right-group">
                            <div class="battery-display" id="batteryLevel">--%</div>
                            <button class="settings-btn" title="Configurações" onclick="openSettingsModal()">⚙</button>
                        </div>
                    </div>
                    <div class="top-row-2">
                        <div class="game-title" id="gameTitle">Carregando...</div>
                        <div class="top-right-group">
                            <button class="top-ctrl-btn" onclick="openSelectFilter()">SELECT</button>
                            <button class="top-ctrl-btn" onclick="openStartConfig()">START</button>
                        </div>
                    </div>
                `;
            } else {
                carousel.className = 'carousel-container landscape';
                topBarElement.className = 'top-bar landscape';
                topBarElement.innerHTML = `
                    <div class="top-left-group">
                        <button class="orientation-btn" onclick="toggleOrientationMode()">💻 Paisagem</button>
                        <div class="game-title" id="gameTitle">Carregando...</div>
                    </div>
                    <div class="top-right-group">
                        <div class="battery-display" id="batteryLevel">--%</div>
                        <button class="top-ctrl-btn" onclick="openSelectFilter()">SELECT</button>
                        <button class="top-ctrl-btn" onclick="openStartConfig()">START</button>
                        <button class="settings-btn" title="Configurações" onclick="openSettingsModal()">⚙</button>
                    </div>
                `;
            }
            updateBattery();
        }

        function openSettingsModal() {
            // Exibe apenas a barra correspondente à orientação atual
            if (currentOrientation === 'portrait') {
                document.getElementById('layoutSliderTitle').textContent = 'Ajuste Retrato';
                document.getElementById('portraitSliderRow').style.display = 'block';
                document.getElementById('landscapeSliderRow').style.display = 'none';
            } else {
                document.getElementById('layoutSliderTitle').textContent = 'Ajuste Paisagem';
                document.getElementById('portraitSliderRow').style.display = 'none';
                document.getElementById('landscapeSliderRow').style.display = 'block';
            }
            openModal('settingsModal');
        }

        function populateDropdowns() {
            const activePlats = platforms.filter(p => p.active);
            const selectsPlat = ['newGamePlatform', 'editGamePlatform', 'filterPlatform'];
            selectsPlat.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const currentVal = el.value;
                el.innerHTML = id === 'filterPlatform' ? '<option value="">Todas</option>' : '';
                activePlats.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.name;
                    opt.textContent = p.name;
                    el.appendChild(opt);
                });
                if (currentVal) el.value = currentVal;
            });

            const selectsGenre = ['newGameGenre', 'editGameGenre', 'filterGenre'];
            selectsGenre.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const currentVal = el.value;
                el.innerHTML = id === 'filterGenre' ? '<option value="">Todos</option>' : '';
                genresList.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g;
                    el.appendChild(opt);
                });
                if (currentVal) el.value = currentVal;
            });
        }

        function getFilteredGames() {
            let list = games.map((g, i) => ({ ...g, originalIndex: i }));

            // Se houver filtros explícitos aplicados (Plataforma, Gênero, Apenas Favoritos ou Ordenação no Modal)
            const isExplicitFilter = activeFilterPlatform !== '' || activeFilterGenre !== '' || activeFilterFavoriteOnly || activeSortOrder !== 'default';

            list = list.filter(g => {
                if (activeFilterPlatform && g.platform !== activeFilterPlatform) return false;
                if (activeFilterGenre && g.genre !== activeFilterGenre) return false;
                if (activeFilterFavoriteOnly && !g.isFavorite) return false;
                return true;
            });

            if (isExplicitFilter) {
                if (activeSortOrder === 'az') {
                    list.sort((a, b) => a.title.localeCompare(b.title, 'pt-BR', { sensitivity: 'base' }));
                } else if (activeSortOrder === 'za') {
                    list.sort((a, b) => b.title.localeCompare(a.title, 'pt-BR', { sensitivity: 'base' }));
                } else if (activeSortOrder === 'recent') {
                    list.sort((a, b) => (b.lastPlayedTimestamp || 0) - (a.lastPlayedTimestamp || 0));
                } else {
                    list.sort((a, b) => a.title.localeCompare(b.title, 'pt-BR', { sensitivity: 'base' }));
                }
                return list;
            }

            // Organização Padrão sem Filtro Explícito:
            // 1. Top 3 Recentes (1º mais recente, 2º penúltimo, 3º antepenúltimo) - sem repetir
            let playedGames = list.filter(g => g.lastPlayedTimestamp).sort((a, b) => b.lastPlayedTimestamp - a.lastPlayedTimestamp);
            let topRecent = playedGames.slice(0, 3);
            let recentIds = new Set(topRecent.map(g => g.originalIndex));

            // 2. Favoritos (A-Z) - sem repetir os recentes
            let favorites = list.filter(g => g.isFavorite && !recentIds.has(g.originalIndex));
            favorites.sort((a, b) => a.title.localeCompare(b.title, 'pt-BR', { sensitivity: 'base' }));
            let favIds = new Set(favorites.map(g => g.originalIndex));

            // 3. Demais Jogos (A-Z) - sem repetir recentes e favoritos
            let others = list.filter(g => !recentIds.has(g.originalIndex) && !favIds.has(g.originalIndex));
            others.sort((a, b) => a.title.localeCompare(b.title, 'pt-BR', { sensitivity: 'base' }));

            return [...topRecent, ...favorites, ...others];
        }

        function renderGames() {
            carousel.innerHTML = '';
            const filtered = getFilteredGames();

            // Identifica IDs dos 3 mais recentes globais para o badge de relorinho
            let playedGames = [...games].map((g, i) => ({...g, originalIndex: i})).filter(g => g.lastPlayedTimestamp).sort((a, b) => b.lastPlayedTimestamp - a.lastPlayedTimestamp);
            let recentTop3Ids = new Set(playedGames.slice(0, 3).map(g => g.originalIndex));

            filtered.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = `game-card ${index === currentIndex ? 'selected' : ''}`;
                
                const starHtml = game.isFavorite ? `<div class="favorite-badge">⭐</div>` : '';
                const isRecentTop3 = recentTop3Ids.has(game.originalIndex);
                const recentHtml = isRecentTop3 ? `<div class="recent-badge" style="color: #4CD964;">⏰</div>` : '';

                card.innerHTML = `
                    <img src="${game.cover || ''}" alt="${game.title}">
                    ${recentHtml}
                    ${starHtml}
                    <div class="platform-badge">${game.platform}</div>
                `;

                card.onclick = () => {
                    currentIndex = index;
                    updateSelection();
                };

                carousel.appendChild(card);
            });

            // Card de Adicionar Jogo (+)
            const addCardIndex = filtered.length;
            const addCard = document.createElement('div');
            addCard.className = `add-card ${currentIndex === addCardIndex ? 'selected' : ''}`;
            addCard.innerHTML = `<div class="add-icon">+</div><div class="add-text">Adicionar</div>`;
            addCard.onclick = () => {
                currentIndex = addCardIndex;
                updateSelection();
                openModal('addGameModal');
            };
            carousel.appendChild(addCard);

            updateSelection();
        }

        function updateSelection() {
            const cards = carousel.querySelectorAll('.game-card, .add-card');
            const filtered = getFilteredGames();
            cards.forEach((card, index) => {
                if (index === currentIndex) {
                    card.classList.add('selected');
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                } else {
                    card.classList.remove('selected');
                }
            });

            const titleEl = document.getElementById('gameTitle');
            if (titleEl) {
                if (currentIndex === filtered.length) {
                    titleEl.textContent = "Adicionar Novo Jogo";
                } else if (filtered[currentIndex]) {
                    titleEl.textContent = filtered[currentIndex].title;
                }
            }
        }

        /* Atalhos de navegação rápida pelas zonas invisíveis */
        function jumpToStart() {
            currentIndex = 0;
            updateSelection();
        }

        function jumpToEnd() {
            const filtered = getFilteredGames();
            currentIndex = filtered.length; // Posiciona no card de Adicionar (+)
            updateSelection();
        }

        function autoFetchCover() {
            const title = document.getElementById('newGameTitle').value.trim();
            if (!title) {
                alert("Digite o título do jogo primeiro para buscar a capa.");
                return;
            }
            // Simulação de busca inteligente integrando link otimizado SteamGridDB
            const mockCoverUrl = `https://cdn2.steamgriddb.com/grid/${encodeURIComponent(title)}.jpg`;
            document.getElementById('newGameCoverUrl').value = mockCoverUrl;
            alert("Capa buscada automaticamente com sucesso!");
        }

        function autoFetchCoverEdit() {
            const title = document.getElementById('editGameTitleModal').textContent.replace('Configurar: ', '').trim();
            const mockCoverUrl = `https://cdn2.steamgriddb.com/grid/${encodeURIComponent(title)}.jpg`;
            document.getElementById('editGameCoverUrl').value = mockCoverUrl;
            alert("Capa atualizada automaticamente!");
        }

        function addNewGame() {
            const title = document.getElementById('newGameTitle').value.trim();
            const platform = document.getElementById('newGamePlatform').value;
            const genre = document.getElementById('newGameGenre').value;
            const url = document.getElementById('newGameCoverUrl').value.trim();
            const execType = document.getElementById('newGameExecType').value;

            if (!title || !platform) {
                alert("Informe ao menos Título e Plataforma.");
                return;
            }

            games.push({ title, platform, genre, cover: url, execType, isFavorite: false });
            saveData();
            populateDropdowns();
            renderGames();
            closeModal('addGameModal');

            document.getElementById('newGameTitle').value = '';
            document.getElementById('newGameCoverUrl').value = '';
        }

        function openStartConfig() {
            const filtered = getFilteredGames();
            if (currentIndex >= filtered.length) {
                openModal('addGameModal');
                return;
            }
            const gameObj = filtered[currentIndex];
            const realIndex = gameObj.originalIndex;
            const game = games[realIndex];

            document.getElementById('editGameTitleModal').textContent = `Configurar: ${game.title}`;
            document.getElementById('editGamePlatform').value = game.platform || '';
            document.getElementById('editGameGenre').value = game.genre || genresList[0];
            document.getElementById('editGameCoverUrl').value = game.cover || '';
            document.getElementById('editGameExecType').value = game.execType || 'aethersx2';
            document.getElementById('editGameFavorite').checked = !!game.isFavorite;
            window.currentGameEditIndex = realIndex;
            openModal('gameConfigModal');
        }

        function saveGameConfig() {
            const gIndex = window.currentGameEditIndex;
            if (games[gIndex]) {
                games[gIndex].platform = document.getElementById('editGamePlatform').value;
                games[gIndex].genre = document.getElementById('editGameGenre').value;
                games[gIndex].cover = document.getElementById('editGameCoverUrl').value.trim();
                games[gIndex].execType = document.getElementById('editGameExecType').value;
                
                const isFavNow = document.getElementById('editGameFavorite').checked;
                if (isFavNow && !games[gIndex].isFavorite) {
                    games[gIndex].isFavorite = true;
                    games[gIndex].favoriteTimestamp = Date.now();
                } else if (!isFavNow && games[gIndex].isFavorite) {
                    games[gIndex].isFavorite = false;
                    delete games[gIndex].favoriteTimestamp;
                }

                saveData();
                populateDropdowns();
                renderGames();
            }
            closeModal('gameConfigModal');
        }

        function deleteCurrentGame() {
            const gIndex = window.currentGameEditIndex;
            if (confirm("Deseja apagar este jogo?")) {
                games.splice(gIndex, 1);
                currentIndex = 0;
                saveData();
                populateDropdowns();
                renderGames();
                closeModal('gameConfigModal');
            }
        }

        function launchGame() {
            const filtered = getFilteredGames();
            if (currentIndex >= filtered.length) {
                openModal('addGameModal');
                return;
            }
            const game = filtered[currentIndex];
            
            // Atualiza histórico de recentes
            games[game.originalIndex].lastPlayedTimestamp = Date.now();
            saveData();

            const emus = {
                'aethersx2': 'AetherSX2 (PS2)',
                'snes9x': 'Snes9x (SNES)',
                'pizzaboy': 'Pizza Boy',
                'ppsspp': 'PPSSPP (PSP)',
                'vita3k': 'Vita3K',
                'dolphin': 'Dolphin',
                'eden': 'Eden (Switch)',
                'gamehub': 'Gamehub (PC)',
                'native': 'Nativo'
            };
            alert(`Iniciando ${game.title}\nPlataforma: ${game.platform}\nEmulador: ${emus[game.execType] || 'Emulador'}`);
            renderGames();
        }

        /* Backup e Restauração */
        function exportBackup() {
            const data = { games, platforms, genresList, visualPrefs, currentOrientation };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `nexus_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.games) games = data.games;
                    if (data.platforms) platforms = data.platforms;
                    if (data.genresList) genresList = data.genresList;
                    if (data.visualPrefs) visualPrefs = data.visualPrefs;
                    if (data.currentOrientation) currentOrientation = data.currentOrientation;
                    saveData();
                    applyVisualPrefs();
                    applyOrientationMode();
                    populateDropdowns();
                    renderGames();
                    alert("Backup importado com sucesso!");
                } catch(err) {
                    alert("Erro ao ler o arquivo.");
                }
            };
            reader.readAsText(file);
        }

        /* Buscas manuais */
        function searchSteamGrid(inputId) {
            const val = document.getElementById(inputId).value.trim();
            window.open(`https://www.steamgriddb.com/search/grids?term=${encodeURIComponent(val)}`, '_blank');
        }
        function searchSteamGridEdit() {
            const filtered = getFilteredGames();
            if (filtered[currentIndex]) window.open(`https://www.steamgriddb.com/search/grids?term=${encodeURIComponent(filtered[currentIndex].title)}`, '_blank');
        }

        /* Filtros e Select */
        function openSelectFilter() {
            populateDropdowns();
            openModal('filterModal');
        }
        function applyFilter() {
            activeFilterPlatform = document.getElementById('filterPlatform').value;
            activeFilterGenre = document.getElementById('filterGenre').value;
            activeFilterFavoriteOnly = document.getElementById('filterFavoriteOnly').checked;
            activeSortOrder = document.getElementById('filterSortOrder').value;
            currentIndex = 0;
            renderGames();
        }
        function clearFilter() {
            document.getElementById('filterPlatform').value = '';
            document.getElementById('filterGenre').value = '';
            document.getElementById('filterFavoriteOnly').checked = false;
            document.getElementById('filterSortOrder').value = 'default';
            activeFilterPlatform = '';
            activeFilterGenre = '';
            activeFilterFavoriteOnly = false;
            activeSortOrder = 'default';
            currentIndex = 0;
            renderGames();
            closeModal('filterModal');
        }

        /* Ações de Controle e Rodapé */
        function handleActionA() {
            if (document.querySelector('.modal.active')) return;
            const filtered = getFilteredGames();
            if (currentIndex === filtered.length) openModal('addGameModal');
            else launchGame();
        }

        function handleActionB() {
            const activeModal = document.querySelector('.modal.active');
            if (activeModal) activeModal.classList.remove('active');
        }

        function handleActionY() {
            if (document.querySelector('.modal.active')) return;
            openModal('searchModal');
            document.getElementById('searchInput').value = '';
            filterSearch();
        }

        function handleActionX() {
            if (document.querySelector('.modal.active')) return;
            const filtered = getFilteredGames();
            if (filtered.length === 0) return;
            currentIndex = Math.floor(Math.random() * filtered.length);
            updateSelection();
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function filterSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const res = document.getElementById('searchResults');
            res.innerHTML = '';

            const filtered = getFilteredGames().filter(g => g.title.toLowerCase().includes(q));
            if (filtered.length === 0) {
                res.innerHTML = '<div style="color:#777; padding:5px;">Nenhum encontrado.</div>';
                return;
            }

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'search-item';
                div.style.cssText = "padding:5px; background:#222; margin-bottom:3px; border-radius:3px; cursor:pointer; font-size:11px;";
                div.textContent = `${item.title} (${item.platform})`;
                div.onclick = () => {
                    const allFiltered = getFilteredGames();
                    const idx = allFiltered.findIndex(g => g.originalIndex === item.originalIndex);
                    if (idx !== -1) currentIndex = idx;
                    updateSelection();
                    closeModal('searchModal');
                };
                res.appendChild(div);
            });
        }

        /* Atalhos de Teclado / GameSir G8 */
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') { handleActionB(); return; }
            if (document.querySelector('.modal.active')) return;

            const filtered = getFilteredGames();
            const max = filtered.length;

            if (currentOrientation === 'portrait') {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    if (currentIndex > 0) { currentIndex--; updateSelection(); }
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    if (currentIndex <= max) { currentIndex++; updateSelection(); }
                } else if (e.key === 'ArrowUp') {
                    if (currentIndex - 2 >= 0) { currentIndex -= 2; updateSelection(); }
                } else if (e.key === 'ArrowDown') {
                    if (currentIndex + 2 <= max) { currentIndex += 2; updateSelection(); }
                }
            } else {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    if (currentIndex > 0) { currentIndex--; updateSelection(); }
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    if (currentIndex <= max) { currentIndex++; updateSelection(); }
                }
            }

            if (e.key === 'Enter' || e.key === ' ') {
                handleActionA();
            } else if (e.key === 'x' || e.key === 'X') {
                handleActionX();
            } else if (e.key === 'y' || e.key === 'Y') {
                handleActionY();
            } else if (e.key === 'Tab') {
                e.preventDefault();
                openSelectFilter();
            }
        });

        function requestFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        function updateBattery() {
            const batteryEl = document.getElementById('batteryLevel');
            if (batteryEl) {
                if ('getBattery' in navigator) {
                    navigator.getBattery().then(b => {
                        batteryEl.textContent = `${Math.round(b.level * 100)}%`;
                    }).catch(() => batteryEl.textContent = "100%");
                } else {
                    batteryEl.textContent = "100%";
                }
            }
        }

        // Inicialização
        loadData();
        renderGames();
        updateBattery();
    </script>
</body>
</html>
