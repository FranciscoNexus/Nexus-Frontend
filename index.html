<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Frontend</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            z-index: 20;
        }

        .game-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70vw;
        }

        .top-right-group {
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
        }

        .battery-display {
            font-size: 14px;
            font-weight: 600;
            color: #dddddd;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #555;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: default;
        }

        /* Área Central (Carrossel) */
        .carousel-container {
            flex: 1;
            display: flex;
            align-items: center;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 0 30px;
            gap: 20px;
            scrollbar-width: none;
        }

        .carousel-container::-webkit-scrollbar {
            display: none;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: #666;
            font-size: 16px;
            padding: 20px;
        }

        .game-card {
            flex: 0 0 auto;
            width: 180px;
            height: 260px;
            border-radius: 10px;
            overflow: hidden;
            background-color: #111;
            border: 3px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            position: relative;
            cursor: pointer;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Impede o menu nativo de imagem do navegador */
        }

        .game-card.selected {
            transform: scale(1.12) translateY(-6px);
            border-color: #ffffff;
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.25);
            z-index: 5;
        }

        .platform-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Cartão de Adicionar Jogo (+) no final do carrossel */
        .add-card {
            flex: 0 0 auto;
            width: 180px;
            height: 260px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 3px dashed rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .add-card:hover, .add-card.selected {
            background: rgba(255, 255, 255, 0.12);
            border-color: #ffffff;
            transform: scale(1.05);
        }

        .add-icon {
            font-size: 48px;
            font-weight: 300;
            color: #aaa;
        }

        .add-text {
            font-size: 13px;
            color: #aaa;
            font-weight: bold;
        }

        /* Rodapé Responsivo */
        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px 25px;
            padding: 10px 15px;
            font-size: 12px;
            color: #aaaaaa;
            background: linear-gradient(to top, rgba(0,0,0,0.98), transparent);
            z-index: 10;
        }

        .button-hint {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }

        .button-hint:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 10px;
            color: #000;
        }

        .btn-a { background-color: #4CD964; }
        .btn-b { background-color: #FF3B30; color: #fff; }
        .btn-x { background-color: #007AFF; color: #fff; }
        .btn-y { background-color: #FFCC00; }

        /* Modais */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #161618;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
        }

        .modal-content h2 {
            margin-bottom: 12px;
            font-size: 18px;
        }

        .settings-group {
            text-align: left;
            margin-bottom: 12px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }

        .settings-group h3 {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 6px;
        }

        .input-row input, .input-row select {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
        }

        .input-row label {
            font-size: 11px;
            color: #aaa;
        }

        .search-results {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            text-align: left;
        }

        .search-item {
            padding: 8px;
            background: #222;
            margin-bottom: 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .search-item:hover {
            background: #333;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }

        .modal-btn {
            background: #333;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: background 0.2s;
        }

        .modal-btn:hover { background: #444; }
        .modal-btn.primary { background: #007AFF; }
        .modal-btn.primary:hover { background: #0a84ff; }
        .modal-btn.danger { background: #FF3B30; }
    </style>
</head>
<body onclick="requestFullscreen()">

    <div class="top-bar">
        <div class="game-title" id="gameTitle">Nenhum Jogo Cadastrado</div>
        <div class="top-right-group">
            <div class="battery-display" id="batteryLevel">--%</div>
            <button class="settings-btn" id="settingsBtn" title="Futuros Temas">⚙</button>
        </div>
    </div>

    <div class="carousel-container" id="carousel"></div>

    <!-- Rodapé com Funções Atualizadas -->
    <div class="bottom-bar">
        <div class="button-hint" onclick="handleActionA()"><span class="btn-icon btn-a">A</span> Abrir</div>
        <div class="button-hint" onclick="handleActionB()"><span class="btn-icon btn-b">B</span> Voltar</div>
        <div class="button-hint" onclick="handleActionY()"><span class="btn-icon btn-y">Y</span> Pesquisar</div>
        <div class="button-hint" onclick="handleActionX()"><span class="btn-icon btn-x">X</span> Aleatório</div>
    </div>

    <!-- Modal Adicionar Jogo -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>Adicionar Novo Jogo</h2>
            <div class="settings-group">
                <div class="input-row">
                    <input type="text" id="newGameTitle" placeholder="Título (Ex: God Of War II)">
                    <input type="text" id="newGamePlatform" placeholder="Plataforma (Ex: PS2)">
                    <label>Capa (Arquivo do Celular):</label>
                    <input type="file" id="newGameCoverFile" accept="image/*">
                    <label>OU URL / Link da Capa:</label>
                    <input type="text" id="newGameCoverUrl" placeholder="https://exemplo.com/capa.jpg">
                    <label>Emulador / Execução:</label>
                    <select id="newGameExecType">
                        <option value="aethersx2">AetherSX2</option>
                        <option value="snes9x">Snes9x EX+</option>
                        <option value="pizzaboy">Pizza Boy</option>
                        <option value="ppsspp">PPSSPP</option>
                        <option value="vita3k">Vita3K+</option>
                        <option value="dolphin">Dolphin Emulator</option>
                        <option value="eden">Eden Legacy</option>
                        <option value="gamehub">Gamehub</option>
                        <option value="native">Outro App / Nativo</option>
                    </select>
                </div>
                <button class="modal-btn primary" style="width: 100%" onclick="addNewGame()">Salvar Jogo</button>
            </div>
            <div class="modal-actions">
                <button class="modal-btn" onclick="toggleSettings(false)">Fechar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal Configuração Individual do Jogo (Segurar A / Toque Longo) -->
    <div class="modal" id="gameConfigModal">
        <div class="modal-content">
            <h2 id="editGameTitleModal">Configurar Jogo</h2>
            <div class="settings-group">
                <div class="input-row">
                    <label>Alterar Capa (Arquivo):</label>
                    <input type="file" id="editGameCoverFile" accept="image/*">
                    <label>OU URL da Capa:</label>
                    <input type="text" id="editGameCoverUrl" placeholder="https://...">
                    <label>Emulador / Execução:</label>
                    <select id="editGameExecType">
                        <option value="aethersx2">AetherSX2</option>
                        <option value="snes9x">Snes9x EX+</option>
                        <option value="pizzaboy">Pizza Boy</option>
                        <option value="ppsspp">PPSSPP</option>
                        <option value="vita3k">Vita3K+</option>
                        <option value="dolphin">Dolphin Emulator</option>
                        <option value="eden">Eden Legacy</option>
                        <option value="gamehub">Gamehub</option>
                        <option value="native">Outro App / Nativo</option>
                    </select>
                </div>
                <button class="modal-btn primary" style="width: 100%" onclick="saveGameConfig()">Salvar Alterações</button>
                <button class="modal-btn danger" style="width: 100%; margin-top: 8px;" onclick="deleteCurrentGame()">Apagar Jogo</button>
            </div>
            <div class="modal-actions">
                <button class="modal-btn" onclick="closeGameConfig()">Cancelar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal de Pesquisa (Botão Y) -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h2>Pesquisar Jogo</h2>
            <div class="settings-group">
                <div class="input-row">
                    <input type="text" id="searchInput" placeholder="Digite o nome do jogo..." oninput="filterSearch()">
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn" onclick="toggleSearch(false)">Fechar (B)</button>
            </div>
        </div>
    </div>

    <script>
        const sfx = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            play(type) {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;

                if (type === 'nav') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'select') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'back') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            }
        };

        function requestFullscreen() {
            sfx.init();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        let games = [];
        let currentIndex = 0;
        let isSettingsOpen = false;
        let isGameConfigOpen = false;
        let isSearchOpen = false;
        let holdTimer = null;

        const carousel = document.getElementById('carousel');
        const gameTitle = document.getElementById('gameTitle');
        const settingsModal = document.getElementById('settingsModal');
        const gameConfigModal = document.getElementById('gameConfigModal');
        const searchModal = document.getElementById('searchModal');

        function loadData() {
            const savedGames = localStorage.getItem('nexus_games');
            if (savedGames) games = JSON.parse(savedGames);
        }

        function saveData() {
            localStorage.setItem('nexus_games', JSON.stringify(games));
        }

        function renderGames() {
            carousel.innerHTML = '';
            
            // Renderiza os cartões dos jogos
            games.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = `game-card ${index === currentIndex ? 'selected' : ''}`;
                card.innerHTML = `
                    <img src="${game.cover || ''}" alt="${game.title}">
                    <div class="platform-badge">${game.platform}</div>
                `;
                
                card.onclick = (e) => {
                    e.stopPropagation();
                    currentIndex = index;
                    updateSelection();
                    saveData();
                    sfx.play('select');
                };

                // Substitui o menu padrão de imagem do navegador pelo menu de configuração do jogo
                card.oncontextmenu = (e) => {
                    e.preventDefault();
                    openGameConfig(index);
                };

                // Suporte a toque longo (long press) para mobile
                let pressTimer;
                card.ontouchstart = () => {
                    pressTimer = setTimeout(() => {
                        openGameConfig(index);
                    }, 700);
                };
                card.ontouchend = () => {
                    clearTimeout(pressTimer);
                };

                carousel.appendChild(card);
            });

            // Adiciona o cartão (+) no final do carrossel para inserir novos jogos
            const addCard = document.createElement('div');
            addCard.className = `add-card ${currentIndex === games.length ? 'selected' : ''}`;
            addCard.innerHTML = `
                <div class="add-icon">+</div>
                <div class="add-text">Adicionar Jogo</div>
            `;
            addCard.onclick = (e) => {
                e.stopPropagation();
                currentIndex = games.length;
                updateSelection();
                toggleSettings(true);
                sfx.play('select');
            };
            carousel.appendChild(addCard);

            updateSelection();
        }

        function updateSelection() {
            const cards = carousel.querySelectorAll('.game-card, .add-card');
            cards.forEach((card, index) => {
                if (index === currentIndex) {
                    card.classList.add('selected');
                    card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                } else {
                    card.classList.remove('selected');
                }
            });
            if (currentIndex < games.length) {
                gameTitle.textContent = games[currentIndex].title;
            } else {
                gameTitle.textContent = "Adicionar Novo Jogo";
