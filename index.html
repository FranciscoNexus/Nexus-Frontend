<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Frontend v0.12</title>
    <style>
        :root {
            --card-width: 180px;
            --card-height: 260px;
            --card-radius: 10px;
            --select-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Topo Inteligente (Responsivo Portrait/Landscape) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            z-index: 20;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
        }

        @media (orientation: portrait) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 10px 15px;
            }
            .top-right-group {
                width: 100%;
                justify-content: flex-end;
            }
            .game-title {
                max-width: 100% !important;
            }
        }

        .game-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 55vw;
        }

        .top-right-group {
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 21;
        }

        .battery-display {
            font-size: 12px;
            font-weight: 600;
            color: #dddddd;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 7px;
            border-radius: 6px;
        }

        .top-ctrl-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .top-ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
        }

        /* Área do Carrossel / Grade */
        .carousel-container {
            flex: 1;
            overflow: auto;
            padding: 15px 25px;
            gap: 20px;
            scrollbar-width: none;
            display: flex;
            align-content: center;
            align-items: center;
        }

        .carousel-container::-webkit-scrollbar {
            display: none;
        }

        @media (orientation: landscape) {
            .carousel-container {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: flex-start;
                align-content: center;
                max-height: calc(100vh - 100px);
            }
        }

        @media (orientation: portrait) {
            .carousel-container {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(var(--card-width), 1fr));
                justify-items: center;
                align-content: start;
                max-height: calc(100vh - 110px);
                gap: 15px;
                padding-top: 10px;
            }
        }

        .game-card {
            flex: 0 0 auto;
            width: var(--card-width);
            height: var(--card-height);
            border-radius: var(--card-radius);
            overflow: hidden;
            background-color: #111;
            border: 3px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            position: relative;
            cursor: pointer;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .game-card.selected {
            transform: scale(1.08) translateY(-3px);
            border-color: var(--select-color);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.25);
            z-index: 5;
        }

        .platform-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 8px;
            font-weight: bold;
            padding: 3px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .favorite-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            font-size: 13px;
            z-index: 2;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
        }

        /* Card de Adicionar Jogo (+) Sempre à Direita / Fim da Lista */
        .add-card {
            flex: 0 0 auto;
            width: var(--card-width);
            height: var(--card-height);
            border-radius: var(--card-radius);
            background-color: rgba(255, 255, 255, 0.05);
            border: 3px dashed rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .add-card.selected {
            border-color: var(--select-color);
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.12);
        }

        .add-icon { font-size: 42px; color: #aaa; }
        .add-text { font-size: 12px; color: #aaa; font-weight: bold; }

        /* Rodapé (Sem Select e Start) */
        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 20px;
            padding: 8px 15px;
            font-size: 12px;
            color: #aaaaaa;
            background: linear-gradient(to top, rgba(0,0,0,0.98), transparent);
            z-index: 10;
        }

        .button-hint {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 10px;
            color: #000;
        }

        .btn-a { background-color: #4CD964; }
        .btn-b { background-color: #FF3B30; color: #fff; }
        .btn-x { background-color: #007AFF; color: #fff; }
        .btn-y { background-color: #FFCC00; }

        /* Modais */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: #161618;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
        }

        .modal-content h2 { margin-bottom: 12px; font-size: 18px; }

        .settings-group {
            text-align: left;
            margin-bottom: 12px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }

        .settings-group h3 {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .input-row input, .input-row select {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
        }

        .input-row label { font-size: 11px; color: #aaa; }

        .cover-tools {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }
        .cover-tools button {
            flex: 1;
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .search-results, .platform-list {
            max-height: 140px;
            overflow-y: auto;
            margin-top: 8px;
            text-align: left;
        }
        .search-item, .platform-item {
            padding: 8px;
            background: #222;
            margin-bottom: 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-item:hover, .platform-item:hover { background: #333; }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }

        .modal-btn {
            background: #333;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .modal-btn.primary { background: #007AFF; }
        .modal-btn.danger { background: #FF3B30; }
        .modal-btn.warning { background: #FF9500; }
    </style>
</head>
<body onclick="requestFullscreen()">

    <div class="top-bar">
        <div class="game-title" id="gameTitle">Carregando...</div>
        <div class="top-right-group">
            <div class="battery-display" id="batteryLevel">--%</div>
            <button class="top-ctrl-btn" onclick="openSelectFilter()">SELECT</button>
            <button class="top-ctrl-btn" onclick="openStartConfig()">START</button>
            <button class="settings-btn" id="settingsBtn" title="Configurações" onclick="openModal('settingsModal')">⚙</button>
        </div>
    </div>

    <div class="carousel-container" id="carousel"></div>

    <!-- Rodapé (Apenas A, B, Y, X) -->
    <div class="bottom-bar">
        <div class="button-hint" onclick="handleActionA()"><span class="btn-icon btn-a">A</span> Abrir</div>
        <div class="button-hint" onclick="handleActionB()"><span class="btn-icon btn-b">B</span> Voltar</div>
        <div class="button-hint" onclick="handleActionY()"><span class="btn-icon btn-y">Y</span> Pesquisar</div>
        <div class="button-hint" onclick="handleActionX()"><span class="btn-icon btn-x">X</span> Aleatório</div>
    </div>

    <!-- Modal Configurações Gerais -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>Configurações do Nexus v0.12</h2>
            
            <div class="settings-group">
                <h3>Visual e Dimensões</h3>
                <div class="input-row">
                    <label>Tamanho/Largura das Capas: <span id="sizeVal">180</span>px</label>
                    <input type="range" id="cardWidthRange" min="90" max="240" value="180" oninput="updateCardSize(this.value)">
                </div>
                <div class="input-row">
                    <label>Cantos:</label>
                    <select id="cardRadiusSelect" onchange="updateCardRadius(this.value)">
                        <option value="0px">Retos (0px)</option>
                        <option value="10px" selected>Arredondado (10px)</option>
                        <option value="20px">Super Arredondado (20px)</option>
                        <option value="50%circular">Circular</option>
                    </select>
                </div>
                <div class="input-row">
                    <label>Cor de Seleção:</label>
                    <input type="color" id="selectColorPicker" value="#ffffff" onchange="updateSelectColor(this.value)" style="height: 35px; cursor: pointer;">
                </div>
            </div>

            <div class="settings-group">
                <h3>Gerenciar Plataformas</h3>
                <div class="platform-list" id="platformListContainer"></div>
                <div class="input-row" style="margin-top: 8px;">
                    <input type="text" id="newPlatformName" placeholder="Nova Plataforma (ex: Nintendo 64)">
                    <button type="button" class="modal-btn warning" style="margin-top:4px;" onclick="addNewPlatform()">Adicionar Plataforma</button>
                </div>
            </div>

            <div class="settings-group">
                <h3>Backup e Dados</h3>
                <div style="display:flex; gap:8px;">
                    <button type="button" class="modal-btn primary" style="flex:1;" onclick="exportBackup()">Salvar / Exportar</button>
                    <button type="button" class="modal-btn warning" style="flex:1;" onclick="document.getElementById('importFile').click()">Importar Backup</button>
                    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackup(event)">
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('settingsModal')">Fechar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal Adicionar Jogo -->
    <div class="modal" id="addGameModal">
        <div class="modal-content">
            <h2>Adicionar Novo Jogo</h2>
            <div class="settings-group">
                <div class="input-row">
                    <input type="text" id="newGameTitle" placeholder="Título (Ex: God Of War II)">
                    <select id="newGamePlatform"></select>
                    <input type="text" id="newGameGenre" placeholder="Gênero (Ex: Ação, RPG, Luta)">
                    <label>URL / Link da Capa:</label>
                    <input type="text" id="newGameCoverUrl" placeholder="https://exemplo.com/capa.jpg">
                    <div class="cover-tools">
                        <button type="button" onclick="searchSteamGrid('newGameTitle')">🔍 SteamGridDB</button>
                        <button type="button" onclick="searchGoogleImages('newGameTitle')">🌐 Google Imagens</button>
                    </div>
                    <label style="margin-top: 6px;">Emulador de Execução:</label>
                    <select id="newGameExecType">
                        <option value="aethersx2">AetherSX2 (PS2)</option>
                        <option value="snes9x">Snes9x EX+ (SNES)</option>
                        <option value="pizzaboy">Pizza Boy (GBA)</option>
                        <option value="ppsspp">PPSSPP (PSP)</option>
                        <option value="vita3k">Vita3K+ (PS Vita)</option>
                        <option value="dolphin">Dolphin (GC/Wii)</option>
                        <option value="eden">Eden Legacy (Switch)</option>
                        <option value="gamehub">Gamehub (PC)</option>
                        <option value="native">Outro App / Nativo</option>
                    </select>
                </div>
                <button type="button" class="modal-btn primary" style="width: 100%; margin-top: 5px;" onclick="addNewGame()">Salvar Jogo</button>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('addGameModal')">Fechar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal Configurar / Excluir Jogo -->
    <div class="modal" id="gameConfigModal">
        <div class="modal-content">
            <h2 id="editGameTitleModal">Configurar Jogo</h2>
            <div class="settings-group">
                <div class="input-row">
                    <select id="editGamePlatform"></select>
                    <input type="text" id="editGameGenre" placeholder="Gênero">
                    <label>URL da Capa:</label>
                    <input type="text" id="editGameCoverUrl" placeholder="https://...">
                    <div class="cover-tools">
                        <button type="button" onclick="searchSteamGridEdit()">🔍 SteamGridDB</button>
                        <button type="button" onclick="searchGoogleEdit()">🌐 Google Imagens</button>
                    </div>
                    <label style="margin-top: 6px;">Emulador:</label>
                    <select id="editGameExecType">
                        <option value="aethersx2">AetherSX2 (PS2)</option>
                        <option value="snes9x">Snes9x EX+ (SNES)</option>
                        <option value="pizzaboy">Pizza Boy (GBA)</option>
                        <option value="ppsspp">PPSSPP (PSP)</option>
                        <option value="vita3k">Vita3K+ (PS Vita)</option>
                        <option value="dolphin">Dolphin (GC/Wii)</option>
                        <option value="eden">Eden Legacy (Switch)</option>
                        <option value="gamehub">Gamehub (PC)</option>
                        <option value="native">Outro App / Nativo</option>
                    </select>
                    <div class="input-row" style="flex-direction: row; align-items: center; gap: 8px; margin-top: 6px;">
                        <input type="checkbox" id="editGameFavorite" style="width: 18px; height: 18px; cursor: pointer;">
                        <label for="editGameFavorite" style="font-size: 13px; color: #fff; cursor: pointer;">Marcar como Jogo Favorito ⭐</label>
                    </div>
                </div>
                <button type="button" class="modal-btn primary" style="width: 100%; margin-top: 5px;" onclick="saveGameConfig()">Salvar Alterações</button>
                <button type="button" class="modal-btn danger" style="width: 100%; margin-top: 8px;" onclick="deleteCurrentGame()">Apagar Jogo</button>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('gameConfigModal')">Cancelar (B)</button>
            </div>
        </div>
    </div>

    <!-- Modal de Filtros (Select) -->
    <div class="modal" id="filterModal">
        <div class="modal-content">
            <h2>Filtrar Biblioteca</h2>
            <div class="settings-group">
                <div class="input-row" style="flex-direction: row; align-items: center; gap: 8px; margin-bottom: 10px;">
                    <input type="checkbox" id="filterFavoriteOnly" onchange="applyFilter()" style="width: 18px; height: 18px; cursor: pointer;">
                    <label for="filterFavoriteOnly" style="font-size: 13px; color: #ffae00; cursor: pointer; font-weight: bold;">⭐ Apenas Jogos Favoritos</label>
                </div>
                <div class="input-row">
                    <label>Filtrar por Plataforma:</label>
                    <select id="filterPlatform" onchange="applyFilter()">
                        <option value="">Todas as Plataformas</option>
                    </select>
                </div>
                <div class="input-row">
                    <label>Filtrar por Gênero:</label>
                    <select id="filterGenre" onchange="applyFilter()">
                        <option value="">Todos os Gêneros</option>
                    </select>
                </div>
                <button type="button" class="modal-btn" style="width:100%; margin-top:6px;" onclick="clearFilter()">Remover Filtros</button>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn primary" onclick="closeModal('filterModal')">Aplicar / Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal Pesquisa (Y) -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h2>Pesquisar Jogo</h2>
            <div class="settings-group">
                <div class="input-row">
                    <input type="text" id="searchInput" placeholder="Digite o nome do jogo..." oninput="filterSearch()">
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="modal-btn" onclick="closeModal('searchModal')">Fechar (B)</button>
            </div>
        </div>
    </div>

    <script>
        let games = [];
        let platforms = [
            { name: 'PlayStation 2', active: true },
            { name: 'Super Nintendo', active: true },
            { name: 'Game Boy Advance', active: true },
            { name: 'PSP', active: true },
            { name: 'PS Vita', active: true },
            { name: 'GameCube / Wii', active: true },
            { name: 'Nintendo Switch', active: true },
            { name: 'PC / Gamehub', active: true }
        ];
        let currentIndex = 0;
        let activeFilterPlatform = '';
        let activeFilterGenre = '';
        let activeFilterFavoriteOnly = false;

        let visualPrefs = { width: 180, radius: '10px', color: '#ffffff' };

        const carousel = document.getElementById('carousel');
        const gameTitle = document.getElementById('gameTitle');

        function loadData() {
            try {
                const savedGames = localStorage.getItem('nexus_games');
                if (savedGames) games = JSON.parse(savedGames);

                const savedPlats = localStorage.getItem('nexus_platforms');
                if (savedPlats) platforms = JSON.parse(savedPlats);

                const savedPrefs = localStorage.getItem('nexus_visual_prefs');
                if (savedPrefs) visualPrefs = JSON.parse(savedPrefs);
            } catch(e) {}
            applyVisualPrefs();
            populatePlatformSelects();
            renderPlatformsManager();
        }

        function saveData() {
            try {
                localStorage.setItem('nexus_games', JSON.stringify(games));
                localStorage.setItem('nexus_platforms', JSON.stringify(platforms));
                localStorage.setItem('nexus_visual_prefs', JSON.stringify(visualPrefs));
            } catch(e) {}
        }

        function applyVisualPrefs() {
            const cardW = visualPrefs.width;
            const cardH = Math.round(cardW * 1.44);

            document.documentElement.style.setProperty('--card-width', cardW + 'px');
            document.documentElement.style.setProperty('--card-height', cardH + 'px');
            
            let rad = visualPrefs.radius === '50%circular' ? '50%' : visualPrefs.radius;
            document.documentElement.style.setProperty('--card-radius', rad);
            document.documentElement.style.setProperty('--select-color', visualPrefs.color);

            if (document.getElementById('cardWidthRange')) document.getElementById('cardWidthRange').value = visualPrefs.width;
            if (document.getElementById('sizeVal')) document.getElementById('sizeVal').textContent = visualPrefs.width;
            if (document.getElementById('cardRadiusSelect')) document.getElementById('cardRadiusSelect').value = visualPrefs.radius;
            if (document.getElementById('selectColorPicker')) document.getElementById('selectColorPicker').value = visualPrefs.color;
        }

        function updateCardSize(val) { visualPrefs.width = parseInt(val); applyVisualPrefs(); saveData(); renderGames(); }
        function updateCardRadius(val) { visualPrefs.radius = val; applyVisualPrefs(); saveData(); }
        function updateSelectColor(val) { visualPrefs.color = val; applyVisualPrefs(); saveData(); }

        function populatePlatformSelects() {
            const activePlats = platforms.filter(p => p.active);
            const selects = ['newGamePlatform', 'editGamePlatform', 'filterPlatform'];
            selects.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const currentVal = el.value;
                el.innerHTML = id === 'filterPlatform' ? '<option value="">Todas as Plataformas</option>' : '';
                activePlats.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.name;
                    opt.textContent = p.name;
                    el.appendChild(opt);
                });
                if (currentVal) el.value = currentVal;
            });

            const genreEl = document.getElementById('filterGenre');
            if (genreEl) {
                const currentGenre = genreEl.value;
                genreEl.innerHTML = '<option value="">Todos os Gêneros</option>';
                const genres = [...new Set(games.map(g => g.genre).filter(Boolean))];
                genres.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g;
                    genreEl.appendChild(opt);
                });
                if (currentGenre) genreEl.value = currentGenre;
            }
        }

        function renderPlatformsManager() {
            const container = document.getElementById('platformListContainer');
            if (!container) return;
            container.innerHTML = '';
            platforms.forEach((p, idx) => {
                const div = document.createElement('div');
                div.className = 'platform-item';
                div.innerHTML = `
                    <span>${p.name}</span>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <label style="font-size:10px; cursor:pointer;"><input type="checkbox" ${p.active ? 'checked' : ''} onchange="togglePlatform(${idx})"> Ativa</label>
                        <button type="button" class="modal-btn danger" style="padding:2px 6px; font-size:10px;" onclick="deletePlatform(${idx})">X</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function addNewPlatform() {
            const input = document.getElementById('newPlatformName');
            const name = input.value.trim();
            if (!name) return;
            platforms.push({ name, active: true });
            input.value = '';
            saveData();
            populatePlatformSelects();
            renderPlatformsManager();
        }

        function togglePlatform(idx) {
            platforms[idx].active = !platforms[idx].active;
            saveData();
            populatePlatformSelects();
            renderPlatformsManager();
        }

        function deletePlatform(idx) {
            if (confirm(`Deseja remover a plataforma ${platforms[idx].name}?`)) {
                platforms.splice(idx, 1);
                saveData();
                populatePlatformSelects();
                renderPlatformsManager();
            }
        }

        function getFilteredGames() {
            let list = games.map((g, i) => ({ ...g, originalIndex: i }));

            list = list.filter(g => {
                if (activeFilterPlatform && g.platform !== activeFilterPlatform) return false;
                if (activeFilterGenre && g.genre !== activeFilterGenre) return false;
                if (activeFilterFavoriteOnly && !g.isFavorite) return false;
                return true;
            });

            const isFiltered = activeFilterPlatform !== '' || activeFilterGenre !== '' || activeFilterFavoriteOnly;

            if (isFiltered) {
                list.sort((a, b) => a.title.localeCompare(b.title, 'pt-BR', { sensitivity: 'base' }));
            } else {
                list.sort((a, b) => {
                    if (a.isFavorite && !b.isFavorite) return -1;
                    if (!a.isFavorite && b.isFavorite) return 1;
                    if (a.isFavorite && b.isFavorite) {
                        return (a.favoriteTimestamp || 0) - (b.favoriteTimestamp || 0);
                    }
                    return a.originalIndex - b.originalIndex;
                });
            }

            return list;
        }

        function renderGames() {
            carousel.innerHTML = '';
            const filtered = getFilteredGames();

            // 1. Renderiza os Jogos Cadastrados
            filtered.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = `game-card ${index === currentIndex ? 'selected' : ''}`;
                const starHtml = game.isFavorite ? `<div class="favorite-badge">⭐</div>` : '';
                card.innerHTML = `
                    <img src="${game.cover || ''}" alt="${game.title}">
                    ${starHtml}
                    <div class="platform-badge">${game.platform}</div>
                `;

                card.onclick = () => {
                    currentIndex = index;
                    updateSelection();
                    launchGame();
                };

                carousel.appendChild(card);
            });

            // 2. O Botão de Adicionar Jogo (+) fica SEMPRE no FINAL DA LISTA (à direita)
            const addCardIndex = filtered.length;
            const addCard = document.createElement('div');
            addCard.className = `add-card ${currentIndex === addCardIndex ? 'selected' : ''}`;
            addCard.innerHTML = `<div class="add-icon">+</div><div class="add-text">Adicionar Jogo</div>`;
            addCard.onclick = () => {
                currentIndex = addCardIndex;
                updateSelection();
                openModal('addGameModal');
            };
            carousel.appendChild(addCard);

            updateSelection();
        }

        function updateSelection() {
            const cards = carousel.querySelectorAll('.game-card, .add-card');
            const filtered = getFilteredGames();
            cards.forEach((card, index) => {
                if (index === currentIndex) {
                    card.classList.add('selected');
                    card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                } else {
                    card.classList.remove('selected');
                }
            });

            if (currentIndex === filtered.length) {
                gameTitle.textContent = "Adicionar Novo Jogo";
            } else if (filtered[currentIndex]) {
                gameTitle.textContent = filtered[currentIndex].title;
            }
        }

        function addNewGame() {
            const title = document.getElementById('newGameTitle').value.trim();
            const platform = document.getElementById('newGamePlatform').value;
            const genre = document.getElementById('newGameGenre').value.trim();
            const url = document.getElementById('newGameCoverUrl').value.trim();
            const execType = document.getElementById('newGameExecType').value;

            if (!title || !platform) {
                alert("Por favor, informe ao menos o Título e a Plataforma.");
                return;
            }

            games.push({ title, platform, genre, cover: url, execType, isFavorite: false });
            saveData();
            populatePlatformSelects();
            renderGames();
            closeModal('addGameModal');

            document.getElementById('newGameTitle').value = '';
            document.getElementById('newGameGenre').value = '';
            document.getElementById('newGameCoverUrl').value = '';
        }

        function openStartConfig() {
            const filtered = getFilteredGames();
            if (currentIndex >= filtered.length) {
                openModal('addGameModal');
                return;
            }
            const gameObj = filtered[currentIndex];
            const realIndex = gameObj.originalIndex;
            const game = games[realIndex];

            document.getElementById('editGameTitleModal').textContent = `Configurar: ${game.title}`;
            document.getElementById('editGamePlatform').value = game.platform || '';
            document.getElementById('editGameGenre').value = game.genre || '';
            document.getElementById('editGameCoverUrl').value = game.cover || '';
            document.getElementById('editGameExecType').value = game.execType || 'aethersx2';
            document.getElementById('editGameFavorite').checked = !!game.isFavorite;
            window.currentGameEditIndex = realIndex;
            openModal('gameConfigModal');
        }

        function saveGameConfig() {
            const gIndex = window.currentGameEditIndex;
            if (games[gIndex]) {
                games[gIndex].platform = document.getElementById('editGamePlatform').value;
                games[gIndex].genre = document.getElementById('editGameGenre').value.trim();
                games[gIndex].cover = document.getElementById('editGameCoverUrl').value.trim();
                games[gIndex].execType = document.getElementById('editGameExecType').value;
                
                const isFavNow = document.getElementById('editGameFavorite').checked;
                if (isFavNow && !games[gIndex].isFavorite) {
                    games[gIndex].isFavorite = true;
                    games[gIndex].favoriteTimestamp = Date.now();
                } else if (!isFavNow && games[gIndex].isFavorite) {
                    games[gIndex].isFavorite = false;
                    delete games[gIndex].favoriteTimestamp;
                }

                saveData();
                populatePlatformSelects();
                renderGames();
            }
            closeModal('gameConfigModal');
        }

        function deleteCurrentGame() {
            const gIndex = window.currentGameEditIndex;
            if (confirm("Deseja apagar este jogo?")) {
                games.splice(gIndex, 1);
                currentIndex = 0;
                saveData();
                populatePlatformSelects();
                renderGames();
                closeModal('gameConfigModal');
            }
        }

        function launchGame() {
            const filtered = getFilteredGames();
            if (currentIndex >= filtered.length) {
                openModal('addGameModal');
                return;
            }
            const game = filtered[currentIndex];
            const emus = {
                'aethersx2': 'AetherSX2 (PS2)',
                'snes9x': 'Snes9x EX+ (SNES)',
                'pizzaboy': 'Pizza Boy',
                'ppsspp': 'PPSSPP (PSP)',
                'vita3k': 'Vita3K+',
                'dolphin': 'Dolphin',
                'eden': 'Eden Legacy (Switch)',
                'gamehub': 'Gamehub (PC)',
                'native': 'App Nativo'
            };
            alert(`Iniciando ${game.title}\nPlataforma: ${game.platform}\nEmulador: ${emus[game.execType] || 'Emulador'}`);
        }

        /* Backup e Restauração */
        function exportBackup() {
            const data = { games, platforms, visualPrefs };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `nexus_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.games) games = data.games;
                    if (data.platforms) platforms = data.platforms;
                    if (data.visualPrefs) visualPrefs = data.visualPrefs;
                    saveData();
                    applyVisualPrefs();
                    populatePlatformSelects();
                    renderPlatformsManager();
                    renderGames();
                    alert("Backup importado com sucesso!");
                } catch(err) {
                    alert("Erro ao ler o arquivo de backup.");
                }
            };
            reader.readAsText(file);
        }

        /* Buscas de Capas */
        function searchSteamGrid(inputId) {
            const val = document.getElementById(inputId).value.trim();
            window.open(`https://www.steamgriddb.com/search/grids?term=${encodeURIComponent(val)}`, '_blank');
        }
        function searchGoogleImages(inputId) {
            const val = document.getElementById(inputId).value.trim();
            window.open(`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(val + ' cover png')}`, '_blank');
        }
        function searchSteamGridEdit() {
            const filtered = getFilteredGames();
            if (filtered[currentIndex]) searchSteamGridTitle(filtered[currentIndex].title);
        }
        function searchGoogleEdit() {
            const filtered = getFilteredGames();
            if (filtered[currentIndex]) searchGoogleImagesTitle(filtered[currentIndex].title);
        }
        function searchSteamGridTitle(t) { window.open(`https://www.steamgriddb.com/search/grids?term=${encodeURIComponent(t)}`, '_blank'); }
        function searchGoogleImagesTitle(t) { window.open(`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(t + ' cover png')}`, '_blank'); }

        /* Filtros e Select */
        function openSelectFilter() {
            populatePlatformSelects();
            openModal('filterModal');
        }
        function applyFilter() {
            activeFilterPlatform = document.getElementById('filterPlatform').value;
            activeFilterGenre = document.getElementById('filterGenre').value;
            activeFilterFavoriteOnly = document.getElementById('filterFavoriteOnly').checked;
            currentIndex = 0;
            renderGames();
        }
        function clearFilter() {
            document.getElementById('filterPlatform').value = '';
            document.getElementById('filterGenre').value = '';
            document.getElementById('filterFavoriteOnly').checked = false;
            activeFilterPlatform = '';
            activeFilterGenre = '';
            activeFilterFavoriteOnly = false;
            currentIndex = 0;
            renderGames();
            closeModal('filterModal');
        }

        /* Ações de Controle e Rodapé */
        function handleActionA() {
            if (document.querySelector('.modal.active')) return;
            const filtered = getFilteredGames();
            if (currentIndex === filtered.length) openModal('addGameModal');
            else launchGame();
        }

        function handleActionB() {
            const activeModal = document.querySelector('.modal.active');
            if (activeModal) activeModal.classList.remove('active');
        }

        function handleActionY() {
            if (document.querySelector('.modal.active')) return;
            openModal('searchModal');
            document.getElementById('searchInput').value = '';
            filterSearch();
        }

        function handleActionX() {
            if (document.querySelector('.modal.active')) return;
            const filtered = getFilteredGames();
            if (filtered.length === 0) return;
            currentIndex = Math.floor(Math.random() * filtered.length);
            updateSelection();
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function filterSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const res = document.getElementById('searchResults');
            res.innerHTML = '';

            const filtered = getFilteredGames().filter(g => g.title.toLowerCase().includes(q));
            if (filtered.length === 0) {
                res.innerHTML = '<div style="color:#777; padding:5px;">Nenhum jogo encontrado.</div>';
                return;
            }

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'search-item';
                div.textContent = `${item.title} (${item.platform})`;
                div.onclick = () => {
                    const allFiltered = getFilteredGames();
                    const idx = allFiltered.findIndex(g => g.originalIndex === item.originalIndex);
                    if (idx !== -1) currentIndex = idx;
                    updateSelection();
                    closeModal('searchModal');
                };
                res.appendChild(div);
            });
        }

        /* Atalhos de Teclado / GameSir G8 */
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') { handleActionB(); return; }
            if (document.querySelector('.modal.active')) return;

            const filtered = getFilteredGames();
            const max = filtered.length;

            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                if (currentIndex > 0) { currentIndex--; updateSelection(); }
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                if (currentIndex <= max) { currentIndex++; updateSelection(); }
            } else if (e.key === 'ArrowUp') {
                if (currentIndex - 2 >= 0) { currentIndex -= 2; updateSelection(); }
            } else if (e.key === 'ArrowDown') {
                if (currentIndex + 2 <= max) { currentIndex += 2; updateSelection(); }
            } else if (e.key === 'Enter' || e.key === ' ') {
                handleActionA();
            } else if (e.key === 'x' || e.key === 'X') {
                handleActionX();
            } else if (e.key === 'y' || e.key === 'Y') {
                handleActionY();
            } else if (e.key === 'Tab') {
                e.preventDefault();
                openSelectFilter();
            }
        });

        window.addEventListener('resize', () => {
            renderGames();
        });

        function requestFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        function updateBattery() {
            const batteryEl = document.getElementById('batteryLevel');
            if ('getBattery' in navigator) {
                navigator.getBattery().then(b => {
                    batteryEl.textContent = `${Math.round(b.level * 100)}%`;
                    b.addEventListener('levelchange', () => batteryEl.textContent = `${Math.round(b.level * 100)}%`);
                }).catch(() => batteryEl.textContent = "100%");
            } else {
                batteryEl.textContent = "100%";
            }
        }

        // Inicialização
        loadData();
        renderGames();
        updateBattery();
    </script>
</body>
</html>
